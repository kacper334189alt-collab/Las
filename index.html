<!DOCTYPE html><!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Beat 'Em Up - Thunderball WD2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #00ffcc; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 15px; }
        .hp-bar { color: #ff3366; font-weight: bold; font-size: 18px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Thunderball VR</h1>
        <p>Twoje Zdrowie: <span id="hp-display" class="hp-bar">10 / 10 HP</span></p>
        <p>Fala: <span id="wave-display" style="color:#00ffcc; font-weight:bold;">1</span></p>
        <p>Broń: <b>Thunderball (Prawa Ręka)</b></p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        // --- SCENA I RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // --- ŚWIATŁO ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 15, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- FIZYKA CANNON.JS ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // Podłoga
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- KONTROLERY VR ---
        const controllerRight = renderer.xr.getController(1); // Prawa ręka
        scene.add(controllerRight);

        // Kinematyczne ciało reprezentujące prawą dłoń
        const handBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
        handBody.addShape(new CANNON.Sphere(0.05));
        world.addBody(handBody);

        // --- FIZYCZNY THUNDERBALL (ŁAŃCUCH + BILA 8) ---
        const chainSegments = 5;
        const segmentRadius = 0.012;
        const segmentHeight = 0.08;
        const chainBodies = [];
        const chainMeshes = [];

        let lastBody = handBody;

        for (let i = 0; i < chainSegments; i++) {
            const body = new CANNON.Body({
                mass: 0.1,
                linearDamping: 0.3,
                angularDamping: 0.3,
                shape: new CANNON.Cylinder(segmentRadius, segmentRadius, segmentHeight, 8)
            });
            body.position.set(0, 1.5 - i * segmentHeight, 0);
            world.addBody(body);
            chainBodies.push(body);

            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(segmentRadius, segmentRadius, segmentHeight),
                new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8 })
            );
            scene.add(mesh);
            chainMeshes.push(mesh);

            // Połączenie przegubowe ogniw
            const constraint = new CANNON.ConeTwistConstraint(lastBody, body, {
                pivotA: new CANNON.Vec3(0, lastBody === handBody ? 0 : -segmentHeight / 2, 0),
                pivotB: new CANNON.Vec3(0, segmentHeight / 2, 0),
                axisA: new CANNON.Vec3(0, -1, 0),
                axisB: new CANNON.Vec3(0, -1, 0),
                angle: Math.PI / 4,
                twistAngle: Math.PI / 4
            });
            world.addConstraint(constraint);
            lastBody = body;
        }

        // Fizyczna Bila 8 na końcu łańcucha
        const ballRadius = 0.08;
        const ballBody = new CANNON.Body({
            mass: 1.2,
            linearDamping: 0.1,
            angularDamping: 0.2,
            shape: new CANNON.Sphere(ballRadius)
        });
        ballBody.position.set(0, 1.5 - chainSegments * segmentHeight - ballRadius, 0);
        world.addBody(ballBody);

        const ballConstraint = new CANNON.PointToPointConstraint(
            lastBody,
            new CANNON.Vec3(0, -segmentHeight / 2, 0),
            ballBody,
            new CANNON.Vec3(0, ballRadius, 0)
        );
        world.addConstraint(ballConstraint);

        // Tekstura bili z ósemką
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(128, 128, 70, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000000'; ctx.font = 'bold 100px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('8', 128, 128);

        const ballTexture = new THREE.CanvasTexture(canvas);
        const ballMesh = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ map: ballTexture, roughness: 0.2 })
        );
        scene.add(ballMesh);

        // --- STATYSTYKI GRACZA I FALE ---
        let playerHP = 10;
        let currentWave = 1;
        let lastDamageTime = 0;

        const hpDisplay = document.getElementById('hp-display');
        const waveDisplay = document.getElementById('wave-display');

        const enemies = [];
        const ragdolls = [];

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 7 + Math.random() * 3;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Ciało ziomeczka
            const bodyMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.3, 1.1),
                new THREE.MeshStandardMaterial({ color: 0x0088ff })
            );
            bodyMesh.position.y = 0.85;
            bodyMesh.castShadow = true;
            group.add(bodyMesh);

            // Głowa
            const headMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.2),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            headMesh.position.y = 1.6;
            group.add(headMesh);

            scene.add(group);

            enemies.push({
                group: group,
                hp: 2, // 2 trafienia i ginie
                alive: true,
                hitCooldown: false
            });
        }

        function startWave() {
            waveDisplay.innerText = currentWave;
            for (let i = 0; i < currentWave * 2; i++) {
                spawnEnemy();
            }
        }
        startWave();

        // Tworzenie ragdolla po śmierci
        function createRagdoll(pos) {
            const body = new CANNON.Body({
                mass: 8,
                shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.85, 0.3)),
                position: new CANNON.Vec3(pos.x, pos.y + 0.85, pos.z)
            });
            // Odrzut od uderzenia
            body.velocity.set((Math.random() - 0.5) * 6, 4, (Math.random() - 0.5) * 6);
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 1.7, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x444444 })
            );
            mesh.castShadow = true;
            scene.add(mesh);

            ragdolls.push({
                mesh: mesh,
                body: body,
                spawnTime: Date.now()
            });
        }

        // --- PĘTLA GRY ---
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            world.step(1 / 60, delta);

            // Aktualizacja pozycji prawej dłoni w świecie fizycznym
            const controllerPos = new THREE.Vector3();
            controllerRight.getWorldPosition(controllerPos);
            handBody.position.copy(controllerPos);

            // Synchronizacja siatki łańcucha z fizyką
            for (let i = 0; i < chainSegments; i++) {
                chainMeshes[i].position.copy(chainBodies[i].position);
                chainMeshes[i].quaternion.copy(chainBodies[i].quaternion);
            }

            // Synchronizacja bili z fizyką
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            const now = Date.now();
            const playerPos = camera.position;

            // Logika Wrogów
            enemies.forEach((enemy) => {
                if (!enemy.alive) return;

                const ePos = enemy.group.position;
                const distToPlayer = ePos.distanceTo(new THREE.Vector3(playerPos.x, 0, playerPos.z));

                // Podchodzenie do gracza
                if (distToPlayer > 0.9) {
                    const dir = new THREE.Vector3().subVectors(playerPos, ePos).normalize();
                    ePos.x += dir.x * delta * 1.3;
                    ePos.z += dir.z * delta * 1.3;
                    enemy.group.lookAt(playerPos.x, ePos.y, playerPos.z);
                } else {
                    // Zadawanie obrażeń graczowi (1 HP na sekundę)
                    if (now - lastDamageTime > 1000) {
                        playerHP = Math.max(0, playerHP - 1);
                        hpDisplay.innerText = `${playerHP} / 10 HP`;
                        lastDamageTime = now;

                        if (playerHP <= 0) {
                            alert("Koniec Gry! Zostałeś pokonany.");
                            window.location.reload();
                        }
                    }
                }

                // Detekcja Trafienia Bili w Wroga
                const hitDist = ballMesh.position.distanceTo(enemy.group.position.clone().add(new THREE.Vector3(0, 1, 0)));
                if (hitDist < 0.65 && !enemy.hitCooldown) {
                    enemy.hp -= 1;
                    enemy.hitCooldown = true;
                    setTimeout(() => enemy.hitCooldown = false, 350);

                    if (enemy.hp <= 0) {
                        enemy.alive = false;
                        scene.remove(enemy.group);
                        createRagdoll(enemy.group.position);
                    }
                }
            });

            // Czyszczenie martwych z tablicy
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) enemies.splice(i, 1);
            }

            // Nowa fala gdy wszyscy zginą
            if (enemies.length === 0) {
                currentWave++;
                startWave();
            }

            // Aktualizacja Ragdolli (usuwanie dokładnie po 5 sekundach)
            for (let i = ragdolls.length - 1; i >= 0; i--) {
                const rd = ragdolls[i];
                rd.mesh.position.copy(rd.body.position);
                rd.mesh.quaternion.copy(rd.body.quaternion);

                if (now - rd.spawnTime > 5000) {
                    scene.remove(rd.mesh);
                    world.removeBody(rd.body);
                    ragdolls.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Beat 'Em Up - Thunderball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,255,200,0.3);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <div id="info">
        <h1>VR Beat 'Em Up - Thunderball</h1>
        <p>Broń: <b>Thunderball (Watch Dogs 2)</b> w prawej ręce</p>
        <p>Zasada: <b>2 ciosy = eliminacja ziomeczka</b></p>
        <p>Ragdolle znikają po 5 sekundach.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        // SCENA I RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);
        scene.fog = new THREE.FogExp2(0x1a1a24, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // ŚWIATŁO
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 12, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // FIZYKA CANNON.JS
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // PODŁOGA
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // KONTROLERY VR
        const controllerRight = renderer.xr.getController(1);
        scene.add(controllerRight);

        // STWORZENIE BRONI: THUNDERBALL
        const handleMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.015, 0.12),
            new THREE.MeshStandardMaterial({ color: 0x111111 })
        );
        controllerRight.add(handleMesh);

        const ballGeo = new THREE.SphereGeometry(0.06, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);

        // Osiemka na bili
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(64, 64, 40, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000000'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('8', 64, 64);
        const numTexture = new THREE.CanvasTexture(canvas);
        const numGeo = new THREE.SphereGeometry(0.061, 32, 32);
        const numMat = new THREE.MeshBasicMaterial({ map: numTexture, transparent: true, opacity: 0.9 });
        const numMesh = new THREE.Mesh(numGeo, numMat);
        ballMesh.add(numMesh);
        scene.add(ballMesh);

        // Fizyka kuli
        const ballBody = new CANNON.Body({ mass: 0.5, shape: new CANNON.Sphere(0.06) });
        ballBody.position.set(0, 1.5, 0);
        world.addBody(ballBody);

        // Łańcuch
        const chainGeo = new THREE.CylinderGeometry(0.005, 0.005, 1);
        const chainMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
        const chainMesh = new THREE.Mesh(chainGeo, chainMat);
        scene.add(chainMesh);

        // LOGIKA WROGÓW (ZIOMECZKI)
        const enemies = [];
        const ragdolls = [];
        let currentWave = 1;

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 6 + Math.random() * 4;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const bodyGeo = new THREE.CapsuleGeometry(0.3, 1.1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd9381e });
            const mesh = new THREE.Mesh(bodyGeo, bodyMat);
            mesh.position.y = 0.85;
            mesh.castShadow = true;
            group.add(mesh);

            const headGeo = new THREE.SphereGeometry(0.2);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 1.6;
            group.add(headMesh);

            scene.add(group);

            const enemy = {
                group: group,
                hp: 2, // 2 hity i umiera
                alive: true
            };
            enemies.push(enemy);
        }

        function startNextWave() {
            for (let i = 0; i < currentWave * 2; i++) {
                spawnEnemy();
            }
        }
        startNextWave();

        function createRagdoll(position) {
            const body = new CANNON.Body({
                mass: 5,
                shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.85, 0.3)),
                position: new CANNON.Vec3(position.x, position.y + 0.85, position.z)
            });
            body.velocity.set((Math.random() - 0.5) * 4, 3, (Math.random() - 0.5) * 4);
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 1.7, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x661111 })
            );
            mesh.castShadow = true;
            scene.add(mesh);

            ragdolls.push({
                mesh: mesh,
                body: body,
                spawnTime: Date.now()
            });
        }

        // PĘTLA APLIKACJI
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            world.step(1 / 60, delta);

            // Łączenie kuli z kontrolerem
            const targetPos = new THREE.Vector3();
            controllerRight.getWorldPosition(targetPos);
            
            // Przyciąganie fizycznej kuli do ręki gracza
            const ballPos = ballBody.position;
            const dir = new THREE.Vector3().subVectors(targetPos, ballPos);
            if (dir.length() > 0.4) {
                ballBody.position.copy(targetPos.clone().add(dir.normalize().multiplyScalar(-0.4)));
            }
            ballBody.applyForce(dir.multiplyScalar(40), ballBody.position);

            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            // Rysowanie linijki/łańcucha
            const start = targetPos;
            const end = ballMesh.position;
            chainMesh.position.copy(start).add(end).multiplyScalar(0.5);
            chainMesh.scale.set(1, start.distanceTo(end), 1);
            chainMesh.lookAt(end);
            chainMesh.rotateX(Math.PI / 2);

            // Ruch ziomeczków w stronę gracza
            const playerPos = camera.position;
            enemies.forEach((enemy) => {
                if (!enemy.alive) return;

                const ePos = enemy.group.position;
                const distance = ePos.distanceTo(new THREE.Vector3(playerPos.x, 0, playerPos.z));

                if (distance > 0.8) {
                    const moveDir = new THREE.Vector3().subVectors(playerPos, ePos).normalize();
                    ePos.x += moveDir.x * delta * 1.2;
                    ePos.z += moveDir.z * delta * 1.2;
                    enemy.group.lookAt(playerPos.x, ePos.y, playerPos.z);
                }

                // Kolizja z Thunderballem
                if (ballMesh.position.distanceTo(enemy.group.position.clone().add(new THREE.Vector3(0, 1, 0))) < 0.6) {
                    if (!enemy.hitCooldown) {
                        enemy.hp -= 1;
                        enemy.hitCooldown = true;
                        setTimeout(() => enemy.hitCooldown = false, 400);

                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            scene.remove(enemy.group);
                            createRagdoll(enemy.group.position);
                        }
                    }
                }
            });

            // Usuwanie martwych wrogów
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) {
                    enemies.splice(i, 1);
                }
            }

            if (enemies.length === 0) {
                currentWave++;
                startNextWave();
            }

            // Aktualizacja ragdolli i ich usuwanie po 5s
            const now = Date.now();
            for (let i = ragdolls.length - 1; i >= 0; i--) {
                const rd = ragdolls[i];
                rd.mesh.position.copy(rd.body.position);
                rd.mesh.quaternion.copy(rd.body.quaternion);

                if (now - rd.spawnTime > 5000) {
                    scene.remove(rd.mesh);
                    world.removeBody(rd.body);
                    ragdolls.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
