
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunderball VR - FlopMC</title>
<style>
body{margin:0;overflow:hidden;background:#050508;font-family:Segoe UI,sans-serif;color:white}
#ui{position:absolute;top:15px;left:15px;z-index:5;background:#0a0a0fee;padding:15px 22px;border:1px solid #00ffcc;border-radius:12px;pointer-events:none}
h1{margin:0 0 8px;color:#00ffcc;font-size:22px}
p{margin:5px 0}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#00ffcc;text-align:center;z-index:5}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}
</script>
</head>
<body>
<div id="ui">
<h1>THUNDERBALL VR</h1>
<p>Zdrowie: <b id="hp">10 / 10 HP</b></p>
<p>Fala: <b id="wave">1</b></p>
<p>Broń: Biliardowa bila na lince</p>
<p id="status">Tryb: ekran</p>
</div>
<div id="hint">Włącz VR i poruszaj prawą ręką, aby rozpędzić bilę.</div>

<script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import * as CANNON from 'cannon-es';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050508);
scene.fog=new THREE.FogExp2(0x050508,0.025);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.05,500);
camera.position.set(0,1.6,3);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const ambient=new THREE.HemisphereLight(0xffffff,0x222233,2);
scene.add(ambient);

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
light.castShadow=true;
scene.add(light);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x181820,roughness:0.9})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(100,100,0x17443f,0x22222a);
grid.position.y=0.005;
scene.add(grid);

const world=new CANNON.World();
world.gravity.set(0,-9.82,0);
world.allowSleep=false;
world.broadphase=new CANNON.SAPBroadphase(world);
world.solver.iterations=12;

const floorBody=new CANNON.Body({mass:0,shape:new CANNON.Plane()});
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

const controllerRight=renderer.xr.getController(0);
const controllerGrip=renderer.xr.getControllerGrip(0);
scene.add(controllerRight);
scene.add(controllerGrip);

const controllerLeft=renderer.xr.getController(1);
scene.add(controllerLeft);

const handMarker=new THREE.Mesh(
new THREE.SphereGeometry(0.045,12,12),
new THREE.MeshBasicMaterial({color:0x00ffcc})
);
handMarker.visible=false;
scene.add(handMarker);

function makeControllerRay(controller,color){
const geometry=new THREE.BufferGeometry().setFromPoints([
new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)
]);
const line=new THREE.Line(geometry,new THREE.LineBasicMaterial({color}));
line.scale.z=0.25;
controller.add(line);
}
makeControllerRay(controllerRight,0x00ffcc);

const ballRadius=0.075;
const ballBody=new CANNON.Body({
mass:0.6,
shape:new CANNON.Sphere(ballRadius),
linearDamping:0.08,
angularDamping:0.08,
material:new CANNON.Material({friction:0.35,restitution:0.65})
});
ballBody.position.set(0,1.3,2.1);
ballBody.collisionFilterGroup=2;
world.addBody(ballBody);

const ballGroup=new THREE.Group();
const ballMesh=new THREE.Mesh(
new THREE.SphereGeometry(ballRadius,24,24),
new THREE.MeshStandardMaterial({color:0x080808,roughness:0.28,metalness:0.35})
);
ballMesh.castShadow=true;
ballGroup.add(ballMesh);

const circle=new THREE.Mesh(
new THREE.CircleGeometry(0.032,24),
new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
);
circle.position.z=ballRadius*0.98;
ballGroup.add(circle);

const numberCanvas=document.createElement('canvas');
numberCanvas.width=128;
numberCanvas.height=128;
const ctx=numberCanvas.getContext('2d');
ctx.fillStyle='white';
ctx.beginPath();
ctx.arc(64,64,60,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='black';
ctx.font='bold 86px Arial';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('8',64,65);

const numberTexture=new THREE.CanvasTexture(numberCanvas);
const numberMesh=new THREE.Mesh(
new THREE.PlaneGeometry(0.045,0.045),
new THREE.MeshBasicMaterial({map:numberTexture,transparent:true,side:THREE.DoubleSide,depthWrite:false})
);
numberMesh.position.z=ballRadius+0.001;
ballGroup.add(numberMesh);
scene.add(ballGroup);

const chainSegments=24;
const chainPositions=new Float32Array((chainSegments+1)*3);
const chainGeometry=new THREE.BufferGeometry();
chainGeometry.setAttribute('position',new THREE.BufferAttribute(chainPositions,3));
const chainMaterial=new THREE.LineBasicMaterial({color:0x9b9b9b});
const chainLine=new THREE.Line(chainGeometry,chainMaterial);
chainLine.frustumCulled=false;
scene.add(chainLine);

// Ozdobne ogniwa widoczne na lince
const links=[];
for(let i=0;i<12;i++){
const link=new THREE.Mesh(
new THREE.TorusGeometry(0.025,0.006,6,10),
new THREE.MeshStandardMaterial({color:0x999999,metalness:0.8,roughness:0.3})
);
scene.add(link);
links.push(link);
}

const handPosition=new THREE.Vector3();
const previousHandPosition=new THREE.Vector3();
const handVelocity=new THREE.Vector3();
const tempVec=new THREE.Vector3();
const tempVec2=new THREE.Vector3();

let handInitialized=false;
let chainLength=0.7;
let playerHP=10;
let currentWave=1;
let lastDamageTime=0;
let gameOver=false;
let lastHitTime=0;

const hpDisplay=document.getElementById('hp');
const waveDisplay=document.getElementById('wave');
const statusDisplay=document.getElementById('status');
const enemies=[];
const ragdolls=[];

function getRightHand(){
const session=renderer.xr.getSession();
if(!session)return null;

let right=null;
let first=null;
for(const source of session.inputSources){
if(!source.gripSpace&&!source.targetRaySpace)continue;
if(!first)first=source;
if(source.handedness==='right'){right=source;break;}
}
return right||first;
}

const xrPosition=new THREE.Vector3();
const xrRotation=new THREE.Quaternion();
const xrScale=new THREE.Vector3();
const xrMatrix=new THREE.Matrix4();

function updateHand(delta){
if(renderer.xr.isPresenting){
const source=getRightHand();
const frame=renderer.xr.getFrame();
const ref=renderer.xr.getReferenceSpace();

if(source&&frame&&ref){
const space=source.gripSpace||source.targetRaySpace;
const pose=frame.getPose(space,ref);

if(pose){
xrMatrix.fromArray(pose.transform.matrix);
xrMatrix.decompose(xrPosition,xrRotation,xrScale);
handPosition.copy(xrPosition);
handMarker.visible=true;
handMarker.position.copy(handPosition);
statusDisplay.textContent='Tryb: VR — śledzenie ręki';
}else{
handMarker.visible=false;
}
}else{
handMarker.visible=false;
}
}else{
/* Tryb testowy: kula porusza się za pomocą myszy */
const x=(mouseX/innerWidth-0.5)*2;
const y=(mouseY/innerHeight);
handPosition.set(x*1.5,1.5+(0.5-y)*1.5,1.1);
handMarker.visible=true;
handMarker.position.copy(handPosition);
statusDisplay.textContent='Tryb: ekran — ruszaj myszą';
}

if(!handInitialized){
previousHandPosition.copy(handPosition);
handInitialized=true;
}

handVelocity.subVectors(handPosition,previousHandPosition)
.divideScalar(Math.max(delta,0.001));
handVelocity.clampLength(0,12);
previousHandPosition.copy(handPosition);
}

let mouseX=innerWidth/2;
let mouseY=innerHeight/2;
addEventListener('pointermove',e=>{
mouseX=e.clientX;
mouseY=e.clientY;
});

function updateChain(){
const start=handPosition;
const end=new THREE.Vector3(ballBody.position.x,ballBody.position.y,ballBody.position.z);
const positions=chainGeometry.attributes.position.array;

for(let i=0;i<=chainSegments;i++){
const t=i/chainSegments;
const sag=Math.sin(t*Math.PI)*Math.min(0.2,Math.max(0,end.distanceTo(start)-chainLength)*0.12);
positions[i*3]=THREE.MathUtils.lerp(start.x,end.x,t);
positions[i*3+1]=THREE.MathUtils.lerp(start.y,end.y,t)-sag;
positions[i*3+2]=THREE.MathUtils.lerp(start.z,end.z,t);
}
chainGeometry.attributes.position.needsUpdate=true;
chainGeometry.computeBoundingSphere();

links.forEach((link,i)=>{
const t=(i+0.5)/links.length;
link.position.lerpVectors(start,end,t);
link.position.y-=Math.sin(t*Math.PI)*Math.min(0.2,Math.max(0,end.distanceTo(start)-chainLength)*0.12);
link.quaternion.setFromUnitVectors(
new THREE.Vector3(0,0,1),
tempVec.subVectors(end,start).normalize()
);
});
}

function spawnEnemy(){
const angle=Math.random()*Math.PI*2;
const dist=7+Math.random()*4;
const x=Math.cos(angle)*dist;
const z=Math.sin(angle)*dist;
const group=new THREE.Group();
group.position.set(x,0,z);

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.3,0.9,4,8),
new THREE.MeshStandardMaterial({color:0x087bea})
);
body.position.y=0.85;
body.castShadow=true;
group.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.2,12,12),
new THREE.MeshStandardMaterial({color:0xffc59a})
);
head.position.y=1.55;
head.castShadow=true;
group.add(head);

scene.add(group);
enemies.push({group,hp:2,alive:true,nextHit:0});
}

function startWave(){
waveDisplay.textContent=currentWave;
for(let i=0;i<currentWave*2;i++)spawnEnemy();
}

function createRagdoll(pos){
const body=new CANNON.Body({
mass:8,
shape:new CANNON.Box(new CANNON.Vec3(0.3,0.8,0.3))
});
body.position.set(pos.x,pos.y+0.8,pos.z);
body.velocity.set((Math.random()-0.5)*6,4,(Math.random()-0.5)*6);
world.addBody(body);

const mesh=new THREE.Mesh(
new THREE.BoxGeometry(0.6,1.6,0.6),
new THREE.MeshStandardMaterial({color:0x444455})
);
mesh.castShadow=true;
scene.add(mesh);
ragdolls.push({mesh,body,time:performance.now()});
}

function hitEnemy(enemy){
const now=performance.now();
if(!enemy.alive||now<enemy.nextHit)return;
enemy.nextHit=now+400;
enemy.hp--;

const direction=new CANNON.Vec3(
enemy.group.position.x-ballBody.position.x,
0.4,
enemy.group.position.z-ballBody.position.z
);
if(direction.lengthSquared()>0)direction.normalize();
ballBody.velocity.x+=direction.x*2;
ballBody.velocity.y+=1.5;
ballBody.velocity.z+=direction.z*2;

if(enemy.hp<=0){
enemy.alive=false;
const pos=enemy.group.position.clone();
scene.remove(enemy.group);
createRagdoll(pos);
}
}

function animate(){
const delta=Math.min(renderer.xr.isPresenting?0.033:0.033,clock.getDelta());
if(delta<=0)return;

updateHand(delta);

// Prawdziwe napięcie linki: sprężyna działa tylko po przekroczeniu długości.
const handToBall=new CANNON.Vec3(
ballBody.position.x-handPosition.x,
ballBody.position.y-handPosition.y,
ballBody.position.z-handPosition.z
);
const distance=handToBall.length();

if(distance>chainLength){
handToBall.normalize();
const stretch=distance-chainLength;
const ballVelocity=new THREE.Vector3(
ballBody.velocity.x,ballBody.velocity.y,ballBody.velocity.z
);
const relativeVelocity=handVelocity.clone().sub(ballVelocity);
const radialSpeed=relativeVelocity.dot(new THREE.Vector3(handToBall.x,handToBall.y,handToBall.z));
const tension=Math.max(0,stretch*150+radialSpeed*5);
const force=Math.min(tension,160);

ballBody.applyForce(
new CANNON.Vec3(-handToBall.x*force,-handToBall.y*force,-handToBall.z*force),
ballBody.position
);

// Pęd zamachu przekazywany kuli
if(handVelocity.length()>1.5){
ballBody.applyImpulse(
new CANNON.Vec3(
handVelocity.x*0.035,
handVelocity.y*0.035,
handVelocity.z*0.035
),
ballBody.position
);
}
}

// Grawitacja i kolizje
world.step(1/60,delta);

ballGroup.position.set(ballBody.position.x,ballBody.position.y,ballBody.position.z);
ballGroup.quaternion.set(ballBody.quaternion.x,ballBody.quaternion.y,ballBody.quaternion.z,ballBody.quaternion.w);
updateChain();

const playerPos=new THREE.Vector3();
if(renderer.xr.isPresenting){
renderer.xr.getCamera(camera).getWorldPosition(playerPos);
}else{
playerPos.copy(camera.position);
}

const now=performance.now();

for(const enemy of enemies){
if(!enemy.alive)continue;

const ePos=enemy.group.position;
const dx=playerPos.x-ePos.x;
const dz=playerPos.z-ePos.z;
const dist=Math.hypot(dx,dz);

if(dist>1){
ePos.x+=(dx/(dist||1))*delta*1.1;
ePos.z+=(dz/(dist||1))*delta*1.1;
enemy.group.lookAt(playerPos.x,ePos.y,playerPos.z);
}else if(now-lastDamageTime>1000&&!gameOver){
playerHP=Math.max(0,playerHP-1);
hpDisplay.textContent=playerHP+' / 10 HP';
lastDamageTime=now;
if(playerHP<=0){
gameOver=true;
document.getElementById('hint').textContent='KONIEC GRY — odśwież stronę, aby spróbować ponownie.';
}
}

const target=ePos.clone().add(new THREE.Vector3(0,1,0));
if(ballGroup.position.distanceTo(target)<0.65)hitEnemy(enemy);
}

for(let i=enemies.length-1;i>=0;i--){
if(!enemies[i].alive)enemies.splice(i,1);
}

if(enemies.length===0&&!gameOver){
currentWave++;
startWave();
}

for(let i=ragdolls.length-1;i>=0;i--){
const r=ragdolls[i];
r.mesh.position.set(r.body.position.x,r.body.position.y,r.body.position.z);
r.mesh.quaternion.set(r.body.quaternion.x,r.body.quaternion.y,r.body.quaternion.z,r.body.quaternion.w);
if(now-r.time>5000){
scene.remove(r.mesh);
world.removeBody(r.body);
ragdolls.splice(i,1);
}
}

renderer.render(scene,camera);
}

const clock=new THREE.Clock();
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
