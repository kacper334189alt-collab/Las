<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FlopVR — Pub Playground</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script>
/* FlopVR — lekki prototyp A-Frame dla Meta Quest 3S.
   Bez zewnętrznego silnika fizyki, cieni i drugiej pętli animacji. */

const pressedKeys = Object.create(null);
let desktopHeld = null;
let hitCount = 0;

function getCamera() {
  return document.querySelector('#camera');
}

function getPropList() {
  return Array.from(document.querySelectorAll('.grabbable'));
}

function vec3() {
  return new THREE.Vector3();
}

const forwardQuaternion = new THREE.Quaternion();

function objectForward(object3D, target) {
  object3D.getWorldQuaternion(forwardQuaternion);
  return target.set(0, 0, -1).applyQuaternion(forwardQuaternion).normalize();
}

/* Powierzchnie, na których mogą zatrzymywać się rekwizyty. */
function tableSurface(x, z) {
  if (x > -3.75 && x < -2.25 && z > -4.2 && z < -3.0) return 0.96;
  if (x > 2.15 && x < 3.75 && z > -4.2 && z < -3.0) return 0.96;
  if (x > -3.0 && x < 3.0 && z > -7.0 && z < -6.0) return 1.53;
  return null;
}

function updateHitCounter() {
  const el = document.querySelector('#hits');
  if (el) el.textContent = 'Trafienia w manekin: ' + hitCount;
}

/* Sterowanie myszką i klawiaturą do testowania bez gogli. */
function desktopGrab() {
  if (desktopHeld) return;

  const camera = getCamera();
  if (!camera) return;

  const origin = camera.object3D.getWorldPosition(vec3());
  const forward = camera.object3D.getWorldDirection(vec3());
  const focus = origin.clone().addScaledVector(forward, 1.0);

  let chosen = null;
  let best = 0.72;

  for (const prop of getPropList()) {
    if (prop.object3D.userData.heldBy) continue;

    const p = prop.object3D.getWorldPosition(vec3());
    const distance = p.distanceTo(focus);

    if (distance < best) {
      best = distance;
      chosen = prop;
    }
  }

  if (chosen) {
    desktopHeld = chosen;
    chosen.object3D.userData.heldBy = 'desktop';

    const physics = chosen.components['physics-prop'];
    if (physics) {
      physics.active = false;
      physics.velocity.set(0, 0, 0);
    }
  }
}

function desktopThrow() {
  if (!desktopHeld) return;

  const prop = desktopHeld;
  desktopHeld = null;
  prop.object3D.userData.heldBy = null;

  const camera = getCamera();
  const forward = camera
    ? camera.object3D.getWorldDirection(vec3())
    : new THREE.Vector3(0, 0, -1);

  const physics = prop.components['physics-prop'];

  if (physics) {
    physics.velocity.copy(forward).multiplyScalar(4.2);
    physics.velocity.y += 0.8;
    physics.active = true;
  }
}

window.addEventListener('keydown', function (e) {
  const key = e.key.toLowerCase();

  if ([
    'w', 'a', 's', 'd',
    'arrowup', 'arrowdown', 'arrowleft', 'arrowright'
  ].includes(key)) {
    pressedKeys[key] = true;
    e.preventDefault();
  }

  if (e.repeat) return;

  if (key === 'e') desktopGrab();
  if (key === 'q') desktopThrow();
});

window.addEventListener('keyup', function (e) {
  pressedKeys[e.key.toLowerCase()] = false;
});

window.addEventListener('blur', function () {
  Object.keys(pressedKeys).forEach(k => pressedKeys[k] = false);
});

/* Prosta fizyka pojedynczego rekwizytu. */
AFRAME.registerComponent('physics-prop', {
  schema: {
    radius: { default: 0.13 },
    bounce: { default: 0.28 }
  },

  init: function () {
    this.velocity = new THREE.Vector3();
    this.active = false;
    this.position = new THREE.Vector3();
    this.forward = new THREE.Vector3();
    this.quaternion = new THREE.Quaternion();

    this.el.object3D.userData.heldBy = null;
    this.el.object3D.userData.physicsVelocity = this.velocity;
    this.el.object3D.userData.radius = this.data.radius;
  },

  tick: function (time, dt) {
    if (!dt || dt < 0.1) return;

    const step = Math.min(dt / 1000, 0.035);
    const object = this.el.object3D;
    const owner = object.userData.heldBy;

    /* Trzymanie przedmiotu przed kamerą na komputerze. */
    if (owner === 'desktop') {
      const camera = getCamera();
      if (!camera) return;

      camera.object3D.getWorldPosition(this.position);
      camera.object3D.getWorldDirection(this.forward);
      this.position.addScaledVector(this.forward, 0.72);
      object.position.copy(this.position);
      return;
    }

    /* Trzymanie przedmiotu przy kontrolerze VR. */
    if (owner && owner.object3D) {
      owner.object3D.getWorldPosition(this.position);
      objectForward(owner.object3D, this.forward);

      this.position.addScaledVector(this.forward, 0.12);
      object.position.copy(this.position);

      owner.object3D.getWorldQuaternion(this.quaternion);
      object.quaternion.copy(this.quaternion);
      return;
    }

    if (!this.active) return;

    const p = object.position;
    const oldY = p.y;

    this.velocity.y -= 9.81 * step;
    p.addScaledVector(this.velocity, step);

    /* Odbicie od blatów. */
    const surface = tableSurface(p.x, p.z);

    if (
      surface !== null &&
      oldY >= surface + this.data.radius - 0.06 &&
      p.y <= surface + this.data.radius &&
      this.velocity.y <= 0
    ) {
      p.y = surface + this.data.radius;
      this.velocity.y = -this.velocity.y * this.data.bounce;
      this.velocity.x *= 0.78;
      this.velocity.z *= 0.78;

      if (Math.abs(this.velocity.y) < 0.35) {
        this.velocity.y = 0;
      }
    }

    /* Podłoga. */
    if (p.y < this.data.radius) {
      p.y = this.data.radius;

      if (this.velocity.y < 0) {
        this.velocity.y = -this.velocity.y * this.data.bounce;
      }

      this.velocity.x *= 0.78;
      this.velocity.z *= 0.78;

      if (Math.abs(this.velocity.y) < 0.3) {
        this.velocity.y = 0;
      }
    }

    /* Granice pokoju. */
    if (p.x < -5.45) {
      p.x = -5.45;
      this.velocity.x = Math.abs(this.velocity.x) * 0.35;
    }

    if (p.x > 5.45) {
      p.x = 5.45;
      this.velocity.x = -Math.abs(this.velocity.x) * 0.35;
    }

    if (p.z < -8.45) {
      p.z = -8.45;
      this.velocity.z = Math.abs(this.velocity.z) * 0.35;
    }

    if (p.z > 2.45) {
      p.z = 2.45;
      this.velocity.z = -Math.abs(this.velocity.z) * 0.35;
    }

    /* Opór powietrza i zatrzymanie leżącego przedmiotu. */
    this.velocity.multiplyScalar(Math.exp(-0.65 * step));

    if (
      this.velocity.lengthSq() < 0.018 &&
      p.y <= this.data.radius + 0.015
    ) {
      this.velocity.set(0, 0, 0);
      this.active = false;
    } else if (
      this.velocity.lengthSq() < 0.004 &&
      surface !== null &&
      p.y <= surface + this.data.radius + 0.02
    ) {
      this.velocity.set(0, 0, 0);
      this.active = false;
    }
  }
});

/* Chwytanie i rzucanie przez kontrolery Meta Quest. */
AFRAME.registerComponent('hand-interaction', {
  init: function () {
    this.held = null;
    this.buttons = new Set();

    this.velocity = new THREE.Vector3();
    this.current = new THREE.Vector3();
    this.previous = new THREE.Vector3();
    this.forward = new THREE.Vector3();

    this.lastTime = 0;
    this.lastHit = 0;

    this.el.addEventListener('triggerdown', () => {
      this.buttons.add('trigger');
      this.grab();
    });

    this.el.addEventListener('gripdown', () => {
      this.buttons.add('grip');
      this.grab();
    });

    this.el.addEventListener('triggerup', () => {
      this.buttons.delete('trigger');
      this.releaseIfReady();
    });

    this.el.addEventListener('gripup', () => {
      this.buttons.delete('grip');
      this.releaseIfReady();
    });
  },

  grab: function () {
    if (this.held) return;

    this.el.object3D.getWorldPosition(this.current);

    let chosen = null;
    let best = 0.48;

    for (const prop of getPropList()) {
      if (prop.object3D.userData.heldBy) continue;

      const p = prop.object3D.getWorldPosition(vec3());
      const distance = p.distanceTo(this.current);

      if (distance < best) {
        best = distance;
        chosen = prop;
      }
    }

    if (!chosen) return;

    this.held = chosen;
    chosen.object3D.userData.heldBy = this.el;

    const physics = chosen.components['physics-prop'];

    if (physics) {
      physics.active = false;
      physics.velocity.set(0, 0, 0);
    }
  },

  releaseIfReady: function () {
    if (this.buttons.size === 0) this.release();
  },

  release: function () {
    if (!this.held) return;

    const prop = this.held;
    this.held = null;
    prop.object3D.userData.heldBy = null;

    objectForward(this.el.object3D, this.forward);

    const physics = prop.components['physics-prop'];

    if (physics) {
      /* Prędkość dłoni i impuls do przodu tworzą prosty rzut. */
      physics.velocity.copy(this.velocity).multiplyScalar(1.15);
      physics.velocity.addScaledVector(this.forward, 1.8);

      if (physics.velocity.length() > 7.5) {
        physics.velocity.setLength(7.5);
      }

      physics.active = true;
    }
  },

  tick: function (time, dt) {
    this.el.object3D.getWorldPosition(this.current);

    if (this.lastTime && dt > 0) {
      const safeDt = Math.max(dt, 4);

      this.velocity
        .copy(this.current)
        .sub(this.previous)
        .multiplyScalar(1000 / safeDt);

      if (this.velocity.length() > 7) {
        this.velocity.setLength(7);
      }
    } else {
      this.velocity.set(0, 0, 0);
    }

    this.previous.copy(this.current);
    this.lastTime = time;
  }
});

/* Płynny ruch: lewy thumbstick oraz WASD na komputerze. */
AFRAME.registerComponent('player-move', {
  init: function () {
    /* Elementy potomne mogą nie być jeszcze gotowe podczas inicjalizacji. */
    this.camera = null;
    this.left = null;

    this.axisX = 0;
    this.axisY = 0;

    this.forward = new THREE.Vector3();
    this.right = new THREE.Vector3();
    this.move = new THREE.Vector3();
  },

  tick: function (time, dt) {
    /* Pobieraj kontrolery dopiero wtedy, gdy są już dostępne. */
    if (!this.camera) {
      this.camera = document.querySelector('#camera');
    }

    if (!this.left) {
      this.left = document.querySelector('#leftController');

      if (this.left) {
        this.left.addEventListener('thumbstickmoved', (event) => {
          this.axisX = event.detail.x || 0;
          this.axisY = event.detail.y || 0;
        });
      }
    }

    if (!dt || !this.camera) return;

    const forwardKeys =
      (pressedKeys.w || pressedKeys.arrowup ? 1 : 0) -
      (pressedKeys.s || pressedKeys.arrowdown ? 1 : 0);

    const sideKeys =
      (pressedKeys.d || pressedKeys.arrowright ? 1 : 0) -
      (pressedKeys.a || pressedKeys.arrowleft ? 1 : 0);

    const f = forwardKeys - this.axisY;
    const s = sideKeys + this.axisX;

    if (Math.abs(f) < 0.04 && Math.abs(s) < 0.04) return;

    this.camera.object3D.getWorldDirection(this.forward);
    this.forward.y = 0;

    if (this.forward.lengthSq() < 0.001) {
      this.forward.set(0, 0, -1);
    }

    this.forward.normalize();
    this.right.set(-this.forward.z, 0, this.forward.x).normalize();

    this.move
      .copy(this.forward)
      .multiplyScalar(f)
      .addScaledVector(this.right, s);

    if (this.move.lengthSq() > 1) {
      this.move.normalize();
    }

    this.el.object3D.position.addScaledVector(
      this.move,
      Math.min(dt / 1000, 0.04) * 2.0
    );

    this.el.object3D.position.x = THREE.MathUtils.clamp(
      this.el.object3D.position.x, -5.1, 5.1
    );

    this.el.object3D.position.z = THREE.MathUtils.clamp(
      this.el.object3D.position.z, -8.0, 2.0
    );
  }
});

/* Manekin: zachwianie i powrót do pozycji startowej. */
AFRAME.registerComponent('target-dummy', {
  init: function () {
    this.home = null;
    this.returnAt = 0;

    this.center = new THREE.Vector3();
    this.direction = new THREE.Vector3();
  },

  hit: function (origin, power, time) {
    if (!this.home) {
      this.home = this.el.object3D.position.clone();
    }

    this.el.object3D.getWorldPosition(this.center);
    this.direction.copy(this.center).sub(origin);
    this.direction.y = 0;

    if (this.direction.lengthSq() < 0.001) {
      this.direction.set(0, 0, 1);
    }

    this.direction.normalize();

    this.el.object3D.position.x +=
      this.direction.x * Math.min(0.18, power * 0.018);

    this.el.object3D.position.z +=
      this.direction.z * Math.min(0.18, power * 0.018);

    this.el.object3D.rotation.z = THREE.MathUtils.clamp(
      this.el.object3D.rotation.z +
      (this.direction.x >= 0 ? -0.65 : 0.65),
      -1.0, 1.0
    );

    this.el.object3D.rotation.x = THREE.MathUtils.clamp(
      this.el.object3D.rotation.x +
      (this.direction.z >= 0 ? 0.16 : -0.16),
      -0.35, 0.35
    );

    this.returnAt = time + 900;
    hitCount++;
    updateHitCounter();
  },

  tick: function (time, dt) {
    if (!this.home) {
      this.home = this.el.object3D.position.clone();
    }

    if (time < this.returnAt) return;

    const rotationBlend = Math.min(1, Math.max(0, dt / 280));
    const positionBlend = Math.min(1, Math.max(0, dt / 450));

    this.el.object3D.rotation.x +=
      (0 - this.el.object3D.rotation.x) * rotationBlend;

    this.el.object3D.rotation.z +=
      (0 - this.el.object3D.rotation.z) * rotationBlend;

    this.el.object3D.position.lerp(this.home, positionBlend);
  }
});

/* Lekkie sprawdzanie kontaktu co około 32 ms, bez skanowania DOM w każdej klatce. */
AFRAME.registerComponent('gameplay-loop', {
  init: function () {
    this.ready = false;
    this.lastCheck = 0;
  },

  tick: function (time) {
    if (!this.ready) {
      this.hands = [
        document.querySelector('#leftController'),
        document.querySelector('#rightController')
      ].filter(Boolean);

      this.props = Array.from(this.el.querySelectorAll('.grabbable'));
      this.dummy = document.querySelector('#dummy');

      this.parts = this.dummy
        ? Array.from(this.dummy.querySelectorAll('.target-part'))
        : [];

      this.ready = true;
    }

    if (
      time - this.lastCheck < 32 ||
      !this.dummy ||
      !this.dummy.components['target-dummy']
    ) {
      return;
    }

    this.lastCheck = time;
    const target = this.dummy.components['target-dummy'];

    /* Kontakt pięści z elementami manekina. */
    for (const hand of this.hands) {
      const interaction = hand.components['hand-interaction'];

      if (
        !interaction ||
        interaction.velocity.length() < 1.35 ||
        time - interaction.lastHit < 420
      ) {
        continue;
      }

      const hp = hand.object3D.getWorldPosition(vec3());
      let contacted = false;

      for (const part of this.parts) {
        if (
          hp.distanceTo(part.object3D.getWorldPosition(vec3())) < 0.27
        ) {
          contacted = true;
          break;
        }
      }

      if (contacted) {
        interaction.lastHit = time;
        target.hit(hp, interaction.velocity.length(), time);
      }
    }

    /* Piankowy rekwizyt może trafić manekin podczas lotu. */
    for (const prop of this.props) {
      const data = prop.object3D.userData;
      const physics = prop.components['physics-prop'];

      if (
        !physics ||
        data.heldBy ||
        physics.velocity.length() < 1.65 ||
        time - (data.lastHit || 0) < 650
      ) {
        continue;
      }

      const pp = prop.object3D.getWorldPosition(vec3());
      let contacted = false;

      for (const part of this.parts) {
        if (
          pp.distanceTo(part.object3D.getWorldPosition(vec3())) < 0.34
        ) {
          contacted = true;
          break;
        }
      }

      if (contacted) {
        data.lastHit = time;
        target.hit(pp, physics.velocity.length(), time);
        physics.velocity.multiplyScalar(0.18);
      }
    }
  }
});
</script>
