
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlopVR — Pub Playground</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#15100d}
#info{position:fixed;z-index:5;top:12px;left:12px;
background:#211811dd;color:#ffe1a6;padding:12px;border-radius:10px;
font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="info">🍺 FLOPVR — PUB PLAYGROUND<br>
VR: przycisk VR w rogu<br>
Desktop: WASD + mysz, E — podnieś, Q — rzuć<br>
Kontrolery: grip/trigger — chwyt i puszczenie</div>

<a-scene
 renderer="antialias:true; colorManagement:true"
 shadow="type:pcfsoft"
 background="color:#17100c"
 vr-mode-ui="enabled:true"
 webxr="optionalFeatures: local-floor, bounded-floor">

 <a-assets>
  <a-mixin id="wood" material="color:#58351f; roughness:0.85"></a-mixin>
 </a-assets>

 <!-- ŚWIATŁO -->
 <a-entity light="type:ambient;intensity:0.8;color:#ffd9aa"></a-entity>
 <a-entity light="type:directional;intensity:1.5;castShadow:true"
           position="-3 7 4"></a-entity>
 <a-entity light="type:point;color:#ff9b45;intensity:1.2;distance:9"
           position="0 3 -3"></a-entity>

 <!-- POMIESZCZENIE -->
 <a-box position="0 -0.15 -2" width="12" height=".3"
        depth="12" color="#38271d"></a-box>
 <a-box position="0 2.5 -8" width="12" height="5"
        depth=".2" color="#543321"></a-box>
 <a-box position="-6 2.5 -2" width=".2" height="5"
        depth="12" color="#43291e"></a-box>
 <a-box position="6 2.5 -2" width=".2" height="5"
        depth="12" color="#43291e"></a-box>
 <a-box position="0 5 -2" width="12" height=".2"
        depth="12" color="#251b16"></a-box>

 <!-- LADA -->
 <a-box position="0 1 -5" width="6" height="1.4"
        depth=".8" color="#59331e"></a-box>
 <a-box position="0 1.73 -5" width="6.2" height=".12"
        depth="1" color="#a56a37"></a-box>

 <!-- STOŁY -->
 <a-entity id="furniture"></a-entity>

 <!-- REKWIZYTY DO CHWYTANIA -->
 <a-entity id="props"></a-entity>

 <!-- MANEKIN TRENINGOWY -->
 <a-entity id="dummy" position="1.5 0 -3">
  <a-cylinder id="body" position="0 1.1 0"
      radius=".3" height=".8" color="#e0b77b"
      class="dummy-part"></a-cylinder>
  <a-sphere id="head" position="0 1.75 0"
      radius=".23" color="#f1d1a3"
      class="dummy-part"></a-sphere>
  <a-box id="armL" position="-.43 1.15 0"
      width=".18" height=".65" depth=".2"
      rotation="0 0 -20" color="#e0b77b"
      class="dummy-part"></a-box>
  <a-box id="armR" position=".43 1.15 0"
      width=".18" height=".65" depth=".2"
      rotation="0 0 20" color="#e0b77b"
      class="dummy-part"></a-box>
  <a-cylinder id="legL" position="-.16 .45 0"
      radius=".12" height=".65" color="#405c80"
      class="dummy-part"></a-cylinder>
  <a-cylinder id="legR" position=".16 .45 0"
      radius=".12" height=".65" color="#405c80"
      class="dummy-part"></a-cylinder>
 </a-entity>

 <!-- GRACZ -->
 <a-entity id="rig" position="0 0 0">
  <a-camera id="camera" position="0 1.65 0"
    look-controls="pointerLockEnabled:false">
   <a-cursor color="#ffd28a" raycaster="objects:.grabbable"></a-cursor>
  </a-camera>

  <!-- Dłonie podążają za kontrolerami -->
  <a-entity id="leftHand" hand-controller="hand:left"
     geometry="primitive:sphere;radius:.09"
     material="color:#e0a878;roughness:.7"
     tracked-controls="hand:left;space:gripSpace"></a-entity>

  <a-entity id="rightHand" hand-controller="hand:right"
     geometry="primitive:sphere;radius:.09"
     material="color:#e0a878;roughness:.7"
     tracked-controls="hand:right;space:gripSpace"></a-entity>
 </a-entity>

 <a-sky color="#17100c"></a-sky>
</a-scene>

<script>
const scene = document.querySelector('a-scene');
const props = document.querySelector('#props');
const furniture = document.querySelector('#furniture');
const rig = document.querySelector('#rig');
const camera = document.querySelector('#camera');
const dummy = document.querySelector('#dummy');

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const vec = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

/* Meble */
function box(parent,pos,size,color){
 const e=document.createElement('a-box');
 e.setAttribute('position',pos.join(' '));
 e.setAttribute('width',size[0]);
 e.setAttribute('height',size[1]);
 e.setAttribute('depth',size[2]);
 e.setAttribute('color',color);
 parent.appendChild(e);
 return e;
}
function table(x,z){
 box(furniture,[x,.85,z],[1.5,.12,1.1],'#80502c');
 for(const dx of [-.6,.6])for(const dz of [-.4,.4])
  box(furniture,[x+dx,.42,z+dz],[.1,.8,.1],'#4b2d1c');
}
function chair(x,z){
 box(furniture,[x,.55,z],[.55,.12,.55],'#a66b3d');
 box(furniture,[x,.95,z-.23],[.55,.8,.1],'#80502c');
 for(const dx of [-.2,.2])for(const dz of [-.2,.2])
  box(furniture,[x+dx,.27,z+dz],[.07,.5,.07],'#59351f');
}
table(-2,-2.5); table(2,-2.5);
chair(-2.7,-2.1); chair(-1.3,-2.1);
chair(1.3,-2.1); chair(2.7,-2.1);

/* Rekwizyty piankowe — lekkie, kreskówkowe */
function makeProp(type,x,y,z,color){
 let e=document.createElement(type==='ball'?'a-sphere':'a-cylinder');
 e.classList.add('grabbable');
 e.dataset.kind=type;
 e.dataset.held='';
 e.dataset.vx='0'; e.dataset.vy='0'; e.dataset.vz='0';
 e.setAttribute('position',`${x} ${y} ${z}`);
 e.setAttribute('color',color);
 if(type==='ball'){
  e.setAttribute('radius','.14');
 }else{
  e.setAttribute('radius','.09');
  e.setAttribute('height',type==='foam'?'.35':'.24');
 }
 e.setAttribute('material','roughness:.55');
 e.object3D.userData.velocity=vec();
 e.object3D.userData.heldBy=null;
 props.appendChild(e);
 return e;
}
makeProp('foam',-.9,1,-4,'#ffb347');
makeProp('foam',.5,1,-4,'#ff7c8a');
makeProp('ball',1.3,1,-3.5,'#69c9ff');
makeProp('foam',-2,1,-2.5,'#b5ec82');

/* Kontrolery i chwytanie */
AFRAME.registerComponent('hand-controller',{
 schema:{hand:{default:'right'}},
 init(){
  this.held=null;
  this.prevButtons={};
  this.velocity=vec();
  this.lastPos=vec();
  this.ready=false;
  this.el.addEventListener('buttondown',e=>this.button(e,true));
  this.el.addEventListener('buttonup',e=>this.button(e,false));
 },
 button(e,down){
  const b=e.detail && e.detail.id;
  if(b==='trigger'||b==='grip'||b===0||b===1){
   if(down)this.grab();
   else this.release();
  }
 },
 grab(){
  if(this.held)return;
  const hand=this.el.object3D.getWorldPosition(vec());
  let best=null,dist=.65;
  document.querySelectorAll('.grabbable').forEach(o=>{
   if(o.object3D.userData.heldBy)return;
   const p=o.object3D.getWorldPosition(vec());
   const d=p.distanceTo(hand);
   if(d<dist){dist=d;best=o;}
  });
  if(best){
   this.held=best;
   best.object3D.userData.heldBy=this.el;
  }
 },
 release(){
  if(!this.held)return;
  const p=this.held.object3D.getWorldPosition(vec());
  const old=this.held;
  old.object3D.userData.heldBy=null;
  old.object3D.userData.velocity.copy(this.velocity).multiplyScalar(1.8);
  this.held=null;
 },
 tick(t,dt){
  const p=this.el.object3D.getWorldPosition(vec());
  if(this.ready && dt>0){
   this.velocity.copy(p).sub(this.lastPos).multiplyScalar(1000/dt);
   if(this.velocity.length()>12)this.velocity.setLength(12);
  }
  this.lastPos.copy(p);
  this.ready=true;

  const xr=scene.renderer && scene.renderer.xr;
  const session=xr&&xr.getSession();
  if(session){
   const source=[...session.inputSources].find(s=>
    s.handedness===this.data.hand&&s.gamepad);
   if(source){
    const gp=source.gamepad;
    // Trigger i grip: najczęściej przyciski 0 i 1.
    const pressed=(gp.buttons[0]?.pressed)||(gp.buttons[1]?.pressed);
    if(pressed&&!this.prevButtons.grab)this.grab();
    if(!pressed&&this.prevButtons.grab)this.release();
    this.prevButtons.grab=pressed;

    // Płynny ruch gałką analogową.
    if(this.data.hand==='left'){
     const axes=gp.axes;
     if(axes.length>=2){
      movement.x=axes[2]??axes[0]??0;
      movement.z=axes[3]??axes[1]??0;
     }
    }
   }
  }

  if(this.held){
   const target=p.clone();
   target.add(vec(0,0,-.12));
   this.held.object3D.position.copy(
    this.held.parentEl.object3D.worldToLocal(target)
   );
   this.held.object3D.userData.velocity.set(0,0,0);
  }
 }
});
let movement={x:0,z:0};
let desktopKeys={};
window.addEventListener('keydown',e=>desktopKeys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>desktopKeys[e.key.toLowerCase()]=false);
window.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='e')tryGrabDesktop();
 if(e.key.toLowerCase()==='q')releaseDesktop();
});
let desktopHeld=null;
function tryGrabDesktop(){
 const hand=camera.object3D.getWorldPosition(vec());
 const dir=vec();
 camera.object3D.getWorldDirection(dir);
 const target=hand.add(dir.multiplyScalar(.8));
 let best=null,dist=.6;
 document.querySelectorAll('.grabbable').forEach(o=>{
  if(o.object3D.userData.heldBy)return;
  const p=o.object3D.getWorldPosition(vec());
  const d=p.distanceTo(target);
  if(d<dist){dist=d;best=o;}
 });
 if(best){desktopHeld=best;best.object3D.userData.heldBy='desktop';}
}
function releaseDesktop(){
 if(!desktopHeld)return;
 const dir=vec();
 camera.object3D.getWorldDirection(dir);
 desktopHeld.object3D.userData.heldBy=null;
 desktopHeld.object3D.userData.velocity.copy(dir.multiplyScalar(6));
 desktopHeld=null;
}

/* Prosta fizyka obiektów */
const gravity=9.81;
function physics(dt){
 const delta=Math.min(dt/1000,.035);
 document.querySelectorAll('.grabbable').forEach(o=>{
  const data=o.object3D.userData;
  if(data.heldBy==='desktop'){
   const p=camera.object3D.getWorldPosition(vec());
   const d=vec();camera.object3D.getWorldDirection(d);
   p.add(d.multiplyScalar(.65));
   o.object3D.position.copy(o.parentEl.object3D.worldToLocal(p));
   return;
  }
  if(data.heldBy)return;
  const v=data.velocity;
  if(v.lengthSq()<.0001)return;
  const p=o.object3D.position;
  v.y-=gravity*delta;
  p.addScaledVector(v,delta);
  if(p.y<.15){p.y=.15;v.y=Math.abs(v.y)*.35;v.x*=.8;v.z*=.8;}
  if(Math.abs(p.x)>5.5||Math.abs(p.z)>7){
   v.x*=-.5;v.z*=-.5;
  }
  v.multiplyScalar(Math.pow(.985,delta*60));
 });
}

/* Manekin: kreskówkowe zachwianie i przewrócenie */
let dummyFall=0;
let dummyVelocity=vec();
function resetDummy(){
 dummy.object3D.position.set(1.5,0,-3);
 dummy.object3D.rotation.set(0,0,0);
 dummyFall=0;dummyVelocity.set(0,0,0);
}
function knockback(point,force){
 const center=dummy.object3D.getWorldPosition(vec());
 const dir=center.sub(point);
 dir.y=.4;
 if(dir.lengthSq()<.001)dir.set(0,0,1);
 dir.normalize();
 dummyVelocity.addScaledVector(dir,force);
 dummyFall=1;
}
function checkHits(){
 const parts=document.querySelectorAll('.dummy-part');
 const hands=[document.querySelector('#leftHand'),document.querySelector('#rightHand')];
 hands.forEach(h=>{
  if(!h.object3D.visible)return;
  const hp=h.object3D.getWorldPosition(vec());
  parts.forEach(part=>{
   const pp=part.object3D.getWorldPosition(vec());
   if(hp.distanceTo(pp)<.23){
    const speed=h.object3D.userData.lastHit||0;
    if(speed<performance.now()-450){
     h.object3D.userData.lastHit=performance.now();
     knockback(hp,2.2);
    }
   }
  });
 });
 document.querySelectorAll('.grabbable').forEach(o=>{
  const p=o.object3D.getWorldPosition(vec());
  const d=dummy.object3D.getWorldPosition(vec());
  if(p.distanceTo(d)<.65&&o.object3D.userData.velocity.length()>2){
   knockback(p,1.2);
   o.object3D.userData.velocity.multiplyScalar(.25);
  }
 });
}
function updateDummy(dt){
 const s=Math.min(dt/1000,.03);
 if(dummyFall>0){
  dummyVelocity.y-=gravity*s;
  dummy.object3D.position.addScaledVector(dummyVelocity,s);
  dummy.object3D.rotation.z+=dummyVelocity.x*s*.6;
  dummy.object3D.rotation.x+=dummyVelocity.z*s*.6;
  dummyVelocity.multiplyScalar(.96);
  if(dummy.object3D.position.y<-.35){
   dummy.object3D.position.y=-.35;
   dummyVelocity.set(0,0,0);
   dummyFall=0;
   setTimeout(resetDummy,1800);
  }
 }
}

/* Ruch desktop i VR */
function locomotion(dt){
 const s=Math.min(dt/1000,.04);
 const cam=camera.object3D;
 const forward=vec();
 cam.getWorldDirection(forward);
 forward.y=0;forward.normalize();
 const right=vec().crossVectors(forward,vec(0,1,0)).normalize();
 let x=0,z=0;
 if(desktopKeys.w)z-=1;
 if(desktopKeys.s)z+=1;
 if(desktopKeys.a)x-=1;
 if(desktopKeys.d)x+=1;
 x+=movement.x;
 z+=movement.z;
 const dir=right.multiplyScalar(x).addScaledVector(forward,-z);
 if(dir.lengthSq()>1)dir.normalize();
 rig.object3D.position.addScaledVector(dir,2.2*s);
 rig.object3D.position.x=clamp(rig.object3D.position.x,-5.3,5.3);
 rig.object3D.position.z=clamp(rig.object3D.position.z,-7,3.5);
}
let previous=performance.now();
function frame(now){
 const dt=now-previous;previous=now;
 physics(dt);checkHits();updateDummy(dt);locomotion(dt);
 requestAnimationFrame(frame);
}
scene.addEventListener('loaded',()=>requestAnimationFrame(frame));
</script>
</a-scene>
</body>
</html>
