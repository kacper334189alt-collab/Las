<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Beat 'Em Up - Thunderball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,255,200,0.3);
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <div id="info">
        <h1>VR Beat 'Em Up - Thunderball</h1>
        <p>Broń: <b>Thunderball (Watch Dogs 2)</b> w prawej ręce</p>
        <p>Zasada: <b>2 ciosy = eliminacja ziomeczka</b></p>
        <p>Ragdolle znikają po 5 sekundach.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        // SCENA I RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);
        scene.fog = new THREE.FogExp2(0x1a1a24, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // ŚWIATŁO
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 12, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // FIZYKA CANNON.JS
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // PODŁOGA
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // KONTROLERY VR
        const controllerRight = renderer.xr.getController(1);
        scene.add(controllerRight);

        // STWORZENIE BRONI: THUNDERBALL
        const handleMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.015, 0.12),
            new THREE.MeshStandardMaterial({ color: 0x111111 })
        );
        controllerRight.add(handleMesh);

        const ballGeo = new THREE.SphereGeometry(0.06, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);

        // Osiemka na bili
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(64, 64, 40, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000000'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('8', 64, 64);
        const numTexture = new THREE.CanvasTexture(canvas);
        const numGeo = new THREE.SphereGeometry(0.061, 32, 32);
        const numMat = new THREE.MeshBasicMaterial({ map: numTexture, transparent: true, opacity: 0.9 });
        const numMesh = new THREE.Mesh(numGeo, numMat);
        ballMesh.add(numMesh);
        scene.add(ballMesh);

        // Fizyka kuli
        const ballBody = new CANNON.Body({ mass: 0.5, shape: new CANNON.Sphere(0.06) });
        ballBody.position.set(0, 1.5, 0);
        world.addBody(ballBody);

        // Łańcuch
        const chainGeo = new THREE.CylinderGeometry(0.005, 0.005, 1);
        const chainMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
        const chainMesh = new THREE.Mesh(chainGeo, chainMat);
        scene.add(chainMesh);

        // LOGIKA WROGÓW (ZIOMECZKI)
        const enemies = [];
        const ragdolls = [];
        let currentWave = 1;

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 6 + Math.random() * 4;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const bodyGeo = new THREE.CapsuleGeometry(0.3, 1.1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd9381e });
            const mesh = new THREE.Mesh(bodyGeo, bodyMat);
            mesh.position.y = 0.85;
            mesh.castShadow = true;
            group.add(mesh);

            const headGeo = new THREE.SphereGeometry(0.2);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 1.6;
            group.add(headMesh);

            scene.add(group);

            const enemy = {
                group: group,
                hp: 2, // 2 hity i umiera
                alive: true
            };
            enemies.push(enemy);
        }

        function startNextWave() {
            for (let i = 0; i < currentWave * 2; i++) {
                spawnEnemy();
            }
        }
        startNextWave();

        function createRagdoll(position) {
            const body = new CANNON.Body({
                mass: 5,
                shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.85, 0.3)),
                position: new CANNON.Vec3(position.x, position.y + 0.85, position.z)
            });
            body.velocity.set((Math.random() - 0.5) * 4, 3, (Math.random() - 0.5) * 4);
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 1.7, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x661111 })
            );
            mesh.castShadow = true;
            scene.add(mesh);

            ragdolls.push({
                mesh: mesh,
                body: body,
                spawnTime: Date.now()
            });
        }

        // PĘTLA APLIKACJI
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            world.step(1 / 60, delta);

            // Łączenie kuli z kontrolerem
            const targetPos = new THREE.Vector3();
            controllerRight.getWorldPosition(targetPos);
            
            // Przyciąganie fizycznej kuli do ręki gracza
            const ballPos = ballBody.position;
            const dir = new THREE.Vector3().subVectors(targetPos, ballPos);
            if (dir.length() > 0.4) {
                ballBody.position.copy(targetPos.clone().add(dir.normalize().multiplyScalar(-0.4)));
            }
            ballBody.applyForce(dir.multiplyScalar(40), ballBody.position);

            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            // Rysowanie linijki/łańcucha
            const start = targetPos;
            const end = ballMesh.position;
            chainMesh.position.copy(start).add(end).multiplyScalar(0.5);
            chainMesh.scale.set(1, start.distanceTo(end), 1);
            chainMesh.lookAt(end);
            chainMesh.rotateX(Math.PI / 2);

            // Ruch ziomeczków w stronę gracza
            const playerPos = camera.position;
            enemies.forEach((enemy) => {
                if (!enemy.alive) return;

                const ePos = enemy.group.position;
                const distance = ePos.distanceTo(new THREE.Vector3(playerPos.x, 0, playerPos.z));

                if (distance > 0.8) {
                    const moveDir = new THREE.Vector3().subVectors(playerPos, ePos).normalize();
                    ePos.x += moveDir.x * delta * 1.2;
                    ePos.z += moveDir.z * delta * 1.2;
                    enemy.group.lookAt(playerPos.x, ePos.y, playerPos.z);
                }

                // Kolizja z Thunderballem
                if (ballMesh.position.distanceTo(enemy.group.position.clone().add(new THREE.Vector3(0, 1, 0))) < 0.6) {
                    if (!enemy.hitCooldown) {
                        enemy.hp -= 1;
                        enemy.hitCooldown = true;
                        setTimeout(() => enemy.hitCooldown = false, 400);

                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            scene.remove(enemy.group);
                            createRagdoll(enemy.group.position);
                        }
                    }
                }
            });

            // Usuwanie martwych wrogów
            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) {
                    enemies.splice(i, 1);
                }
            }

            if (enemies.length === 0) {
                currentWave++;
                startNextWave();
            }

            // Aktualizacja ragdolli i ich usuwanie po 5s
            const now = Date.now();
            for (let i = ragdolls.length - 1; i >= 0; i--) {
                const rd = ragdolls[i];
                rd.mesh.position.copy(rd.body.position);
                rd.mesh.quaternion.copy(rd.body.quaternion);

                if (now - rd.spawnTime > 5000) {
                    scene.remove(rd.mesh);
                    world.removeBody(rd.body);
                    ragdolls.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
