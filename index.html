<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THUNDERBALL VR</title>
<style>
html,body{margin:0;overflow:hidden;background:#080d12;color:white;font:16px Arial}
#ui{position:fixed;top:12px;left:12px;z-index:2;background:#07111cdd;padding:14px;border:1px solid #38baff;border-radius:10px}
button{background:#087cb5;color:white;border:0;padding:12px;margin:4px;border-radius:7px;font-weight:bold}
#help{font-size:12px;color:#b9d8e9;max-width:270px}
</style>
</head>
<body>
<div id="ui">
<b>THUNDERBALL // VR</b>
<div id="stats">Fala: 1 | Wrogowie: 0 | HP: 100</div>
<button id="vr">WEJDŹ DO VR</button>
<button id="hack">HACK [H]</button>
<div id="help">Lewa gałka: ruch • Prawa ręka: Thunderball • Trigger: atak • Grip: hack • Na płaskim ekranie: WASD + mysz</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8998a5);
scene.fog=new THREE.Fog(0x8998a5,18,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);
camera.position.set(0,1.65,5);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.xr.enabled=true;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcce5ff,0x34312b,2));
const sun=new THREE.DirectionalLight(0xffe2c0,3);
sun.position.set(-8,15,7);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=mat(0x505963),dark=mat(0x151e27,.4,.65),blue=mat(0x00aaff,.3,.4);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x343a3f));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

const grid=new THREE.GridHelper(60,60,0x426171,0x343f48);
grid.position.y=.012;scene.add(grid);

function box(x,y,z,sx,sy,sz,material){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
for(let i=0;i<20;i++){
 const side=i%2?1:-1,z=-i*3+8;
 box(side*(7+Math.random()*3),2.5,z,3+Math.random()*3,5,2,concrete);
 box(side*7,5.1,z,1,.12,2.1,blue);
}
for(let i=0;i<12;i++){
 const x=(Math.random()-.5)*12,z=-Math.random()*35;
 box(x,.55,z,1.7,.8,3, dark);
 box(x,.98,z-1.5,.8,.04,.05,blue);
}

const enemies=[];
let wave=0,hp=100,kills=0,energy=100,gameOver=false;
const stats=document.querySelector('#stats');
const bodyMat=mat(0x373e48),headMat=mat(0xb9a18b),red=mat(0xb91f31);
function spawnEnemy(){
 const g=new THREE.Group();
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.65,4,8),bodyMat);
 torso.position.y=1.15;torso.castShadow=true;g.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),headMat);
 head.position.y=1.72;head.castShadow=true;g.add(head);
 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.10,.55,3,6),dark);
  leg.position.set(side*.13,.42,0);g.add(leg);
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.55,3,6),red);
  arm.position.set(side*.37,1.2,0);arm.rotation.z=side*.2;g.add(arm);
 }
 const a=Math.random()*Math.PI*2,d=9+Math.random()*12;
 g.position.set(camera.position.x+Math.sin(a)*d,0,camera.position.z-Math.cos(a)*d);
 scene.add(g);
 enemies.push({g,hp:2,attack:0,phase:Math.random()*6});
}
function startWave(){wave++;for(let i=0;i<Math.min(3+wave,12);i++)spawnEnemy();}
startWave();

const weapon=new THREE.Group();
const handle=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,.28,12),dark);
weapon.add(handle);handle.rotation.x=Math.PI/2;
const orb=new THREE.Mesh(new THREE.SphereGeometry(.14,20,16),blue);
orb.position.z=-.22;weapon.add(orb);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.19,.025,8,24),mat(0x6ce8ff,.25,.6));
ring.position.z=-.22;weapon.add(ring);
const light=new THREE.PointLight(0x00aaff,2,3);light.position.z=-.2;weapon.add(light);
scene.add(weapon);

const raycaster=new THREE.Raycaster();
const tempMat=new THREE.Matrix4();
let controllers=[],session=null,attacking=false,attackCooldown=0,hackMode=false;
let mouseDown=false,keys={},yaw=0,pitch=0,prevMouse=null;
const velocity=new THREE.Vector3();
let damageFlash=0;

function playerPosition(){
 return renderer.xr.isPresenting?renderer.xr.getCamera(camera).position:camera.position;
}
function handWorld(controller){
 const p=new THREE.Vector3();controller.getWorldPosition(p);return p;
}
function hitEnemy(origin,dir,range=2.2){
 let best=null,dist=range;
 for(const e of enemies){
  if(!e.g.visible)continue;
  const p=e.g.position.clone().add(new THREE.Vector3(0,1,0));
  const v=p.sub(origin),along=v.dot(dir);
  if(along<0||along>dist)continue;
  const closest=origin.clone().addScaledVector(dir,along);
  if(closest.distanceTo(e.g.position.clone().add(new THREE.Vector3(0,1,0)))<.65){
   best=e;dist=along;
  }
 }
 return best;
}
function doAttack(origin,dir){
 if(attackCooldown>0||gameOver)return;
 attackCooldown=.32;
 const target=hitEnemy(origin,dir,2.4);
 if(target){
  target.hp--;
  const impulse=dir.clone().multiplyScalar(2.4);
  target.g.position.add(impulse);
  target.g.rotation.x=(Math.random()-.5)*.35;
  target.g.rotation.z=(Math.random()-.5)*.3;
  target.g.scale.y=target.hp<=0?.01:1;
  if(target.hp<=0){
   scene.remove(target.g);
   enemies.splice(enemies.indexOf(target),1);
   kills++;
   if(enemies.length===0)startWave();
  }
 }
 orb.material=mat(0xffffff,.2,.4);
 setTimeout(()=>orb.material=blue,90);
}
function doHack(){
 const origin=camera.getWorldPosition(new THREE.Vector3());
 const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
 raycaster.set(origin,dir);raycaster.far=12;
 const targets=scene.children.filter(o=>o.isMesh&&o.material===blue);
 const hits=raycaster.intersectObjects(targets,false);
 if(hits.length){
  hits[0].object.material=mat(0x55ff88,.25,.4);
  energy=Math.max(0,energy-5);
  setTimeout(()=>{if(hits[0]?.object)hits[0].object.material=blue},3000);
 }else{
  for(const e of enemies){
   if(e.g.position.distanceTo(origin)<10){
    e.g.rotation.y+=Math.PI;
    e.g.position.add(new THREE.Vector3((Math.random()-.5)*2,0,2));
   }
  }
 }
}
document.querySelector('#hack').onclick=doHack;
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='h')doHack();
 if(e.code==='Space')mouseDown=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouseDown=false});
renderer.domElement.addEventListener('mousedown',e=>{mouseDown=true;prevMouse={x:e.clientX,y:e.clientY}});
addEventListener('mouseup',()=>mouseDown=false);
renderer.domElement.addEventListener('mousemove',e=>{
 if(!prevMouse)return;
 if(mouseDown){
  yaw-=(e.clientX-prevMouse.x)*.003;
  pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-prevMouse.y)*.003));
 }
 prevMouse={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('click',()=>{
 if(!renderer.xr.isPresenting)renderer.domElement.requestPointerLock?.();
});

document.querySelector('#vr').onclick=async()=>{
 if(!navigator.xr){alert('Ta przeglądarka nie udostępnia WebXR. Otwórz stronę w Meta Quest Browser przez HTTPS.');return}
 try{
  if(!await navigator.xr.isSessionSupported('immersive-vr'))throw Error('VR niedostępne');
  session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
  await renderer.xr.setSession(session);
  controllers=[];
  for(let i=0;i<2;i++){
   const c=renderer.xr.getController(i);
   c.userData.index=i;
   c.addEventListener('selectstart',()=>{
    if(i===1){
     const o=c.getWorldPosition(new THREE.Vector3());
     const d=new THREE.Vector3(0,0,-1).applyQuaternion(c.getWorldQuaternion(new THREE.Quaternion()));
     doAttack(o,d);
    }
   });
   c.addEventListener('squeezestart',()=>{if(i===0)doHack()});
   scene.add(c);controllers.push(c);
   const grip=renderer.xr.getControllerGrip(i);
   if(i===1)grip.add(weapon);
   scene.add(grip);
  }
  session.addEventListener('end',()=>{session=null});
 }catch(e){alert('Nie udało się uruchomić VR: '+e.message)}
};

const clock=new THREE.Clock();
function update(){
 const dt=Math.min(clock.getDelta(),.04);
 attackCooldown=Math.max(0,attackCooldown-dt);
 if(!renderer.xr.isPresenting){
  camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();
  if(keys.w)move.add(forward);if(keys.s)move.sub(forward);
  if(keys.d)move.add(right);if(keys.a)move.sub(right);
  if(move.lengthSq())move.normalize().multiplyScalar(4*dt);
  camera.position.add(move);camera.position.y=1.65;
  if(mouseDown&&attackCooldown<=0){
   const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
   doAttack(camera.position,dir);
  }
  weapon.position.copy(camera.position).add(new THREE.Vector3(.35,-.35,-.65).applyQuaternion(camera.quaternion));
  weapon.quaternion.copy(camera.quaternion);
 }else{
  const p=playerPosition();
  for(const c of controllers){
   if(c.userData.index===1){
    weapon.position.copy(handWorld(c));
    weapon.quaternion.copy(c.getWorldQuaternion(new THREE.Quaternion()));
   }
  }
 }
 const p=playerPosition();
 for(const e of enemies){
  const to=p.clone().sub(e.g.position);to.y=0;
  const d=to.length();
  if(d>1.25){
   to.normalize();e.g.position.addScaledVector(to,dt*(.65+Math.min(wave*.035,.5)));
   e.g.rotation.y=Math.atan2(to.x,to.z);
  }else{
   e.attack-=dt;
   if(e.attack<=0){e.attack=.9;hp=Math.max(0,hp-5);damageFlash=.2;if(hp===0)gameOver=true}
  }
  e.phase+=dt*7;
  e.g.children[1].position.y=1.72+Math.sin(e.phase)*.025;
 }
 damageFlash=Math.max(0,damageFlash-dt);
 stats.textContent=gameOver?'KONIEC GRY — odśwież stronę':`Fala: ${wave} | Wrogowie: ${enemies.length} | Eliminacje: ${kills} | HP: ${hp}`;
 if(damageFlash>0)scene.background.set(0x882222);else scene.background.set(0x8998a5);
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(update);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
