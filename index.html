
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunderball VR</title>

<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: #10151b;
  font-family: Arial, sans-serif;
}
#info {
  position: fixed;
  top: 14px;
  left: 14px;
  padding: 12px 15px;
  color: white;
  background: #15191dcc;
  border: 1px solid #a96b32;
  border-radius: 10px;
  line-height: 1.6;
  z-index: 2;
  user-select: none;
}
#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  color: white;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="info">
  <b>THUNDERBALL VR</b><br>
  WASD — chodzenie<br>
  Mysz — rozglądanie się<br>
  LPM / SPACJA — rzut kulą<br>
  VR: prawy trigger — rzut<br>
  VR: lewy joystick — ruch<br>
  <span id="status">Tryb desktopowy</span>
</div>
<div id="crosshair">+</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8b8);
scene.fog = new THREE.Fog(0x87a8b8, 18, 75);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.05, 150
);
camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const status = document.getElementById('status');

scene.add(new THREE.HemisphereLight(0xdcecff, 0x51402c, 2));

const sun = new THREE.DirectionalLight(0xffe1b3, 2.2);
sun.position.set(-6, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// Materiały
const metal = new THREE.MeshStandardMaterial({
  color: 0x373b40, metalness: 0.85, roughness: 0.27
});
const bronze = new THREE.MeshStandardMaterial({
  color: 0xa7662c, metalness: 0.75, roughness: 0.3
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x17191c, roughness: 0.85
});
const ballMat = new THREE.MeshStandardMaterial({
  color: 0x252a30, metalness: 0.9, roughness: 0.22
});
const chainMat = new THREE.MeshStandardMaterial({
  color: 0xc18a4d, metalness: 0.85, roughness: 0.25
});

// Podłoże
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x65765b, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Siatka na ziemi
const grid = new THREE.GridHelper(100, 100, 0x52634a, 0x52634a);
grid.position.y = 0.012;
scene.add(grid);

// Otoczenie
for (let i = 0; i < 35; i++) {
  const x = (Math.random() - 0.5) * 45;
  const z = -Math.random() * 40 - 4;
  const height = 1.5 + Math.random() * 3;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.22, height, 7),
    new THREE.MeshStandardMaterial({ color: 0x57402c })
  );
  trunk.position.set(x, height / 2, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.1 + Math.random(), 2.7, 7),
    new THREE.MeshStandardMaterial({ color: 0x345b39 })
  );
  leaves.position.set(x, height + 1, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

// Konstrukcja broni
function createWeapon() {
  const group = new THREE.Group();

  const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.07, 0.34, 10),
    rubber
  );
  handle.rotation.x = Math.PI / 2;
  handle.position.set(0, 0, -0.12);
  handle.castShadow = true;
  group.add(handle);

  const guard = new THREE.Mesh(
    new THREE.TorusGeometry(0.105, 0.022, 8, 16),
    bronze
  );
  guard.position.set(0, 0, -0.28);
  group.add(guard);

  const connector = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.045, 0.12, 10),
    metal
  );
  connector.rotation.x = Math.PI / 2;
  connector.position.set(0, 0, -0.34);
  group.add(connector);

  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(0.065, 12, 10),
    bronze
  );
  cap.position.set(0, 0, -0.4);
  group.add(cap);

  return group;
}

// Prawdziwa broń i broń do trybu desktopowego
const vrWeapon = createWeapon();
const desktopWeapon = createWeapon();

vrWeapon.position.set(0.10, -0.08, -0.22);
vrWeapon.rotation.set(-0.18, 0.12, -0.25);

desktopWeapon.position.set(0.32, -0.27, -0.65);
desktopWeapon.rotation.set(0.15, -0.15, -0.25);
camera.add(desktopWeapon);
scene.add(camera);

// Kula
const ball = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.16, 2),
  ballMat
);
ball.castShadow = true;
scene.add(ball);

// Metalowe kolce kuli
for (let i = 0; i < 8; i++) {
  const spike = new THREE.Mesh(
    new THREE.ConeGeometry(0.045, 0.19, 6),
    bronze
  );
  const direction = new THREE.Vector3(
    Math.sin(i * Math.PI / 4),
    Math.cos(i * Math.PI / 4),
    (i % 2 ? 0.7 : -0.7)
  ).normalize();

  spike.position.copy(direction.clone().multiplyScalar(0.14));
  spike.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0), direction
  );
  ball.add(spike);
}

// DOKŁADNIE CZTERY ogniwa łańcucha
const links = [];
for (let i = 0; i < 4; i++) {
  const link = new THREE.Mesh(
    new THREE.TorusGeometry(0.032, 0.009, 6, 12),
    chainMat
  );
  link.castShadow = true;
  scene.add(link);
  links.push(link);
}

// Kontrolery VR
const controllers = [];
const grips = [];

for (let i = 0; i < 2; i++) {
  const controller = renderer.xr.getController(i);
  scene.add(controller);
  controllers.push(controller);

  const grip = renderer.xr.getControllerGrip(i);
  scene.add(grip);
  grips.push(grip);
}

grips[1].add(vrWeapon);

// Kierunek rzutu i stan kuli
let flying = false;
let returning = false;
let ballVelocity = new THREE.Vector3();
let previousThrow = false;
let lastThrowTime = 0;

const startWorld = new THREE.Vector3();
const endWorld = new THREE.Vector3();
const tempWorld = new THREE.Vector3();
const direction = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);

function getAnchor() {
  const activeVR = renderer.xr.isPresenting;

  if (activeVR) {
    vrWeapon.updateWorldMatrix(true, false);
    return vrWeapon.localToWorld(new THREE.Vector3(0, 0, -0.43));
  }

  desktopWeapon.updateWorldMatrix(true, false);
  return desktopWeapon.localToWorld(new THREE.Vector3(0, 0, -0.43));
}

function throwBall() {
  if (flying || returning) return;

  const anchor = getAnchor();
  ball.position.copy(anchor);

  if (renderer.xr.isPresenting) {
    const controller = controllers[1];
    controller.getWorldDirection(direction);
  } else {
    camera.getWorldDirection(direction);
  }

  direction.normalize();
  ballVelocity.copy(direction).multiplyScalar(8);
  flying = true;
  lastThrowTime = performance.now();
}

function updateChain() {
  startWorld.copy(getAnchor());
  endWorld.copy(ball.position);

  const delta = endWorld.clone().sub(startWorld);
  const distance = delta.length();

  if (distance < 0.001) {
    for (const link of links) link.visible = false;
    return;
  }

  direction.copy(delta).normalize();

  for (let i = 0; i < links.length; i++) {
    const t = (i + 0.5) / links.length;
    const link = links[i];

    link.visible = true;
    link.position.copy(startWorld).lerp(endWorld, t);
    link.quaternion.setFromUnitVectors(up, direction);

    // Naprzemienne ustawienie ogniw
    link.rotation.y += i % 2 ? Math.PI / 2 : 0;
  }
}

function returnBall(dt) {
  const anchor = getAnchor();
  const delta = anchor.sub(ball.position);
  const distance = delta.length();

  if (distance < 0.22) {
    ball.position.copy(anchor);
    flying = false;
    returning = false;
    ballVelocity.set(0, 0, 0);
    return;
  }

  delta.normalize();
  ballVelocity.lerp(delta.multiplyScalar(12), Math.min(1, dt * 5));
  ball.position.addScaledVector(ballVelocity, dt);
}

// Chodzenie desktopowe
const keys = {};
let yaw = 0;
let pitch = 0;
let mouseLocked = false;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    throwBall();
  }
});

addEventListener('keyup', e => {
  keys[e.code] = false;
});

renderer.domElement.addEventListener('click', () => {
  if (!renderer.xr.isPresenting && !mouseLocked) {
    renderer.domElement.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', e => {
  if (!mouseLocked || renderer.xr.isPresenting) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = THREE.MathUtils.clamp(pitch, -1.45, 1.45);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
});

addEventListener('mousedown', e => {
  if (e.button === 0) throwBall();
});

// Sterowanie VR
function updateVRMovement(dt) {
  if (!renderer.xr.isPresenting) return;

  const session = renderer.xr.getSession();
  if (!session) return;

  let moveX = 0;
  let moveZ = 0;

  for (const source of session.inputSources) {
    if (!source.gamepad) continue;

    const axes = source.gamepad.axes;
    const isLeft = source.handedness === 'left';

    if (isLeft && axes.length >= 2) {
      moveX = axes[0] || 0;
      moveZ = axes[1] || 0;
    }

    if (source.handedness === 'right') {
      const pressed = source.gamepad.buttons.some(
        (button, index) => index > 0 && button.pressed
      );

      if (pressed && !previousThrow) throwBall();
      previousThrow = pressed;
    }
  }

  const xrCamera = renderer.xr.getCamera(camera);
  const forward = new THREE.Vector3();
  xrCamera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();

  const right = new THREE.Vector3()
    .crossVectors(forward, up)
    .normalize()
    .negate();

  const movement = new THREE.Vector3()
    .addScaledVector(right, moveX)
    .addScaledVector(forward, -moveZ);

  if (movement.lengthSq() > 1) movement.normalize();
  movement.multiplyScalar(3 * dt);

  // Przesuwamy scenę przeciwnie do ruchu gracza
  scene.position.sub(movement);
}

// Proste cele treningowe
const targets = [];

for (let i = 0; i < 7; i++) {
  const target = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.25, 0.7, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x8c4540 })
  );
  body.position.y = 0.72;
  body.castShadow = true;
  target.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xc69a78 })
  );
  head.position.y = 1.3;
  head.castShadow = true;
  target.add(head);

  target.position.set(
    (Math.random() - 0.5) * 12,
    0,
    -5 - Math.random() * 15
  );

  scene.add(target);
  targets.push(target);
}

const clock = new THREE.Clock();

renderer.xr.addEventListener('sessionstart', () => {
  status.textContent = 'VR aktywny';
  desktopWeapon.visible = false;
  vrWeapon.visible = true;
  previousThrow = false;
});

renderer.xr.addEventListener('sessionend', () => {
  status.textContent = 'Tryb desktopowy';
  desktopWeapon.visible = true;
  vrWeapon.visible = true;
  scene.position.set(0, 0, 0);
  previousThrow = false;
});

function animate() {
  const dt = Math.min(clock.getDelta(), 0.04);

  if (!renderer.xr.isPresenting) {
    const speed = 4 * dt;
    const forward = new THREE.Vector3(
      -Math.sin(yaw), 0, -Math.cos(yaw)
    );
    const right = new THREE.Vector3(
      Math.cos(yaw), 0, -Math.sin(yaw)
    );

    if (keys.KeyW) camera.position.addScaledVector(forward, speed);
    if (keys.KeyS) camera.position.addScaledVector(forward, -speed);
    if (keys.KeyA) camera.position.addScaledVector(right, -speed);
    if (keys.KeyD) camera.position.addScaledVector(right, speed);
    if (keys.ShiftLeft) camera.position.addScaledVector(forward, speed);
    if (keys.ControlLeft) camera.position.addScaledVector(forward, -speed);
  } else {
    updateVRMovement(dt);
  }

  if (flying) {
    ballVelocity.y -= 5.5 * dt;
    ball.position.addScaledVector(ballVelocity, dt);

    // Odbicie od ziemi
    if (ball.position.y < 0.17) {
      ball.position.y = 0.17;
      ballVelocity.y = Math.abs(ballVelocity.y) * 0.55;
      ballVelocity.x *= 0.8;
      ballVelocity.z *= 0.8;
    }

    // Automatyczny powrót po chwili
    if (performance.now() - lastThrowTime > 1300) {
      flying = false;
      returning = true;
    }
  }

  if (returning) returnBall(dt);

  if (!flying && !returning) {
    ball.position.copy(getAnchor());
  }

  // Trafienie w cele
  if (flying) {
    for (const target of targets) {
      if (!target.visible) continue;

      const targetCenter = target.position.clone();
      targetCenter.y += 0.8;

      if (ball.position.distanceTo(targetCenter) < 0.65) {
        target.visible = false;
        flying = false;
        returning = true;
        break;
      }
    }
  }

  updateChain();

  // Obrót kuli podczas lotu
  if (flying) {
    ball.rotation.x += dt * 8;
    ball.rotation.z += dt * 10;
  }

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
