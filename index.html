<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Beat 'Em Up - Thunderball WD2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 15, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #00ffcc; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 15px; }
        .hp-bar { color: #ff3366; font-weight: bold; font-size: 18px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Thunderball VR</h1>
        <p>Twoje Zdrowie: <span id="hp-display" class="hp-bar">10 / 10 HP</span></p>
        <p>Fala: <span id="wave-display" style="color:#00ffcc; font-weight:bold;">1</span></p>
        <p>Broń: <b>Thunderball (8 ogniw + Bila)</b></p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import * as CANNON from 'cannon-es';

        // --- SCENA I RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // --- ŚWIATŁO ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 15, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- FIZYKA CANNON.JS ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        // Podłoga
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        const floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- KONTROLERY VR ---
        const controllerRight = renderer.xr.getController(1); // Prawa ręka
        scene.add(controllerRight);

        // Kinematyczne ciało dłoni
        const handBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
        handBody.addShape(new CANNON.Sphere(0.04));
        world.addBody(handBody);

        // --- FIZYCZNY THUNDERBALL (8 OGNIW ŁAŃCUCHA + BILA 8) ---
        const chainSegments = 8; // Dokładnie 8 ruchomych części łańcucha
        const segmentRadius = 0.01;
        const segmentHeight = 0.05;
        const chainBodies = [];
        const chainMeshes = [];

        let lastBody = handBody;

        for (let i = 0; i < chainSegments; i++) {
            const body = new CANNON.Body({
                mass: 0.05,
                linearDamping: 0.1,
                angularDamping: 0.1,
                shape: new CANNON.Cylinder(segmentRadius, segmentRadius, segmentHeight, 6)
            });
            body.position.set(0, 1.5 - i * segmentHeight, 0);
            world.addBody(body);
            chainBodies.push(body);

            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(segmentRadius, segmentRadius, segmentHeight),
                new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9, roughness: 0.2 })
            );
            scene.add(mesh);
            chainMeshes.push(mesh);

            // Swobodne połączenie przegubowe (ConeTwist) dla pełnej ruchomości
            const constraint = new CANNON.ConeTwistConstraint(lastBody, body, {
                pivotA: new CANNON.Vec3(0, lastBody === handBody ? 0 : -segmentHeight / 2, 0),
                pivotB: new CANNON.Vec3(0, segmentHeight / 2, 0),
                axisA: new CANNON.Vec3(0, -1, 0),
                axisB: new CANNON.Vec3(0, -1, 0),
                angle: Math.PI / 2,
                twistAngle: Math.PI / 2
            });
            world.addConstraint(constraint);
            lastBody = body;
        }

        // Fizyczna Bila 8 na końcu łańcucha
        const ballRadius = 0.07;
        const ballBody = new CANNON.Body({
            mass: 0.8,
            linearDamping: 0.1,
            angularDamping: 0.1,
            shape: new CANNON.Sphere(ballRadius)
        });
        ballBody.position.set(0, 1.5 - chainSegments * segmentHeight - ballRadius, 0);
        world.addBody(ballBody);

        const ballConstraint = new CANNON.PointToPointConstraint(
            lastBody,
            new CANNON.Vec3(0, -segmentHeight / 2, 0),
            ballBody,
            new CANNON.Vec3(0, ballRadius, 0)
        );
        world.addConstraint(ballConstraint);

        // Tekstura bili z ósemką
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(128, 128, 70, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000000'; ctx.font = 'bold 100px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('8', 128, 128);

        const ballTexture = new THREE.CanvasTexture(canvas);
        const ballMesh = new THREE.Mesh(
            new THREE.SphereGeometry(ballRadius, 32, 32),
            new THREE.MeshStandardMaterial({ map: ballTexture, roughness: 0.2 })
        );
        scene.add(ballMesh);

        // --- STATYSTYKI GRACZA I FALE ---
        let playerHP = 10;
        let currentWave = 1;
        let lastDamageTime = 0;

        const hpDisplay = document.getElementById('hp-display');
        const waveDisplay = document.getElementById('wave-display');

        const enemies = [];
        const ragdolls = [];

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 7 + Math.random() * 3;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const bodyMesh = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.3, 1.1),
                new THREE.MeshStandardMaterial({ color: 0x0088ff })
            );
            bodyMesh.position.y = 0.85;
            bodyMesh.castShadow = true;
            group.add(bodyMesh);

            const headMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.2),
                new THREE.MeshStandardMaterial({ color: 0xffcc99 })
            );
            headMesh.position.y = 1.6;
            group.add(headMesh);

            scene.add(group);

            enemies.push({
                group: group,
                hp: 2, // 2 hity i ginie
                alive: true,
                hitCooldown: false
            });
        }

        function startWave() {
            waveDisplay.innerText = currentWave;
            for (let i = 0; i < currentWave * 2; i++) {
                spawnEnemy();
            }
        }
        startWave();

        function createRagdoll(pos) {
            const body = new CANNON.Body({
                mass: 8,
                shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.85, 0.3)),
                position: new CANNON.Vec3(pos.x, pos.y + 0.85, pos.z)
            });
            body.velocity.set((Math.random() - 0.5) * 6, 4, (Math.random() - 0.5) * 6);
            world.addBody(body);

            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 1.7, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x444444 })
            );
            mesh.castShadow = true;
            scene.add(mesh);

            ragdolls.push({
                mesh: mesh,
                body: body,
                spawnTime: Date.now()
            });
        }

        // --- PĘTLA GRY ---
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            world.step(1 / 60, delta);

            // Aktualizacja pozycji dłoni
            const controllerPos = new THREE.Vector3();
            controllerRight.getWorldPosition(controllerPos);
            handBody.position.copy(controllerPos);

            // Synchronizacja ogniw łańcucha
            for (let i = 0; i < chainSegments; i++) {
                chainMeshes[i].position.copy(chainBodies[i].position);
                chainMeshes[i].quaternion.copy(chainBodies[i].quaternion);
            }

            // Synchronizacja bili
            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            const now = Date.now();
            const playerPos = camera.position;

            // Logika Wrogów
            enemies.forEach((enemy) => {
                if (!enemy.alive) return;

                const ePos = enemy.group.position;
                const distToPlayer = ePos.distanceTo(new THREE.Vector3(playerPos.x, 0, playerPos.z));

                if (distToPlayer > 0.9) {
                    const dir = new THREE.Vector3().subVectors(playerPos, ePos).normalize();
                    ePos.x += dir.x * delta * 1.3;
                    ePos.z += dir.z * delta * 1.3;
                    enemy.group.lookAt(playerPos.x, ePos.y, playerPos.z);
                } else {
                    if (now - lastDamageTime > 1000) {
                        playerHP = Math.max(0, playerHP - 1);
                        hpDisplay.innerText = `${playerHP} / 10 HP`;
                        lastDamageTime = now;

                        if (playerHP <= 0) {
                            alert("Koniec Gry! Zostałeś pokonany.");
                            window.location.reload();
                        }
                    }
                }

                // Trafienie bili w wroga
                const hitDist = ballMesh.position.distanceTo(enemy.group.position.clone().add(new THREE.Vector3(0, 1, 0)));
                if (hitDist < 0.65 && !enemy.hitCooldown) {
                    enemy.hp -= 1;
                    enemy.hitCooldown = true;
                    setTimeout(() => enemy.hitCooldown = false, 350);

                    if (enemy.hp <= 0) {
                        enemy.alive = false;
                        scene.remove(enemy.group);
                        createRagdoll(enemy.group.position);
                    }
                }
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                if (!enemies[i].alive) enemies.splice(i, 1);
            }

            if (enemies.length === 0) {
                currentWave++;
                startWave();
            }

            // Ragdolle (znikają po 5 sekundach)
            for (let i = ragdolls.length - 1; i >= 0; i--) {
                const rd = ragdolls[i];
                rd.mesh.position.copy(rd.body.position);
                rd.mesh.quaternion.copy(rd.body.quaternion);

                if (now - rd.spawnTime > 5000) {
                    scene.remove(rd.mesh);
                    world.removeBody(rd.body);
                    ragdolls.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
