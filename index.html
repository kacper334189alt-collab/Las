
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunderball VR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:white;font-family:Arial,sans-serif}
#ui{position:fixed;top:12px;left:12px;padding:14px;background:#080c12dd;border:1px solid #00ffcc;border-radius:10px;z-index:5;pointer-events:none}
h2{color:#00ffcc;margin:0 0 8px}
p{margin:5px 0;font-size:14px}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;background:#080c12cc;padding:10px;border-radius:8px;width:max-content;max-width:90%;z-index:5}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
  "cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
 }
}
</script>
</head>
<body>
<div id="ui">
<h2>THUNDERBALL</h2>
<p>HP: <b id="hp">100</b></p>
<p>Wrogowie: <b id="enemies">0</b></p>
<p>Łańcuch: <b>30 segmentów</b></p>
<p id="mode">Tryb: ekran</p>
</div>
<div id="help">VR: lewy drążek — chodzenie, prawy kontroler — broń. Na ekranie: WASD + mysz.</div>

<script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import * as CANNON from 'cannon-es';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070a12);
scene.fog=new THREE.Fog(0x070a12,15,65);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,200);
camera.position.set(0,1.65,5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xbad8ff,0x242033,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(5,12,5);
sun.castShadow=true;
scene.add(sun);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x171923,roughness:.85})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(100,100,0x00aa99,0x282c38);
grid.position.y=.01;
scene.add(grid);

for(let i=0;i<20;i++){
const a=i*Math.PI*2/20;
const pillar=new THREE.Mesh(
new THREE.BoxGeometry(.5,3,.5),
new THREE.MeshStandardMaterial({color:0x222735,metalness:.5,roughness:.5})
);
pillar.position.set(Math.cos(a)*12,1.5,Math.sin(a)*12);
pillar.castShadow=true;
scene.add(pillar);
}

const world=new CANNON.World();
world.gravity.set(0,-9.82,0);
world.solver.iterations=10;
world.allowSleep=false;

const floorBody=new CANNON.Body({mass:0,shape:new CANNON.Plane()});
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

// Gracz
const player=new THREE.Group();
player.position.set(0,0,5);
scene.add(player);
player.add(camera);
camera.position.set(0,1.65,0);

let yaw=0,pitch=0;
const keys={};
let mouseLocked=false;
let hp=100;
let gameEnded=false;
let lastDamage=0;

addEventListener('keydown',e=>{keys[e.code]=true;});
addEventListener('keyup',e=>{keys[e.code]=false;});
renderer.domElement.addEventListener('click',()=>{
if(!renderer.xr.isPresenting)renderer.domElement.requestPointerLock?.();
});
addEventListener('pointerlockchange',()=>mouseLocked=document.pointerLockElement===renderer.domElement);
addEventListener('mousemove',e=>{
if(mouseLocked&&!renderer.xr.isPresenting){
yaw-=e.movementX*.002;
pitch-=e.movementY*.002;
pitch=Math.max(-1.4,Math.min(1.4,pitch));
camera.rotation.order='YXZ';
camera.rotation.set(pitch,yaw,0);
}
});

// Kontrolery VR
const leftController=renderer.xr.getController(0);
const rightController=renderer.xr.getController(1);
scene.add(leftController,rightController);

const leftGrip=renderer.xr.getControllerGrip(0);
const rightGrip=renderer.xr.getControllerGrip(1);
scene.add(leftGrip,rightGrip);

function makeGrip(){
const g=new THREE.Group();
const handle=new THREE.Mesh(
new THREE.CylinderGeometry(.025,.035,.22,10),
new THREE.MeshStandardMaterial({color:0x292d35,metalness:.8,roughness:.25})
);
g.add(handle);
const pommel=new THREE.Mesh(
new THREE.SphereGeometry(.055,12,12),
new THREE.MeshStandardMaterial({color:0x00ccaa,metalness:.6,roughness:.3})
);
pommel.position.y=-.12;
g.add(pommel);
return g;
}
rightGrip.add(makeGrip());

const ballRadius=.13;
const ball=new THREE.Mesh(
new THREE.SphereGeometry(ballRadius,24,24),
new THREE.MeshStandardMaterial({color:0x15171c,metalness:.9,roughness:.22})
);
ball.castShadow=true;
scene.add(ball);

const emblem=new THREE.Mesh(
new THREE.CircleGeometry(.045,20),
new THREE.MeshBasicMaterial({color:0x00ffcc,side:THREE.DoubleSide})
);
emblem.position.z=ballRadius-.002;
ball.add(emblem);

// 30 fizycznych segmentów łańcucha
const SEGMENTS=30;
const links=[];
const linkGeo=new THREE.CapsuleGeometry(.025,.07,3,6);
const linkMat=new THREE.MeshStandardMaterial({color:0x9299a5,metalness:.9,roughness:.25});

for(let i=0;i<SEGMENTS;i++){
const mesh=new THREE.Mesh(linkGeo,linkMat);
mesh.castShadow=true;
scene.add(mesh);
links.push(mesh);
}

// Wirtualne punkty symulujące elastyczny łańcuch
const points=[];
const oldPoints=[];
for(let i=0;i<=SEGMENTS;i++){
points.push(new THREE.Vector3());
oldPoints.push(new THREE.Vector3());
}
let chainReady=false;

const handWorld=new THREE.Vector3();
const prevHandWorld=new THREE.Vector3();
const handVelocity=new THREE.Vector3();
const tmp=new THREE.Vector3();
const tmp2=new THREE.Vector3();
const DOWN=new THREE.Vector3(0,-1,0);

function getHandPosition(){
if(renderer.xr.isPresenting){
rightGrip.updateWorldMatrix(true,false);
rightGrip.getWorldPosition(handWorld);
if(!handWorld.toArray().every(Number.isFinite))handWorld.set(0,1.3,0);
}else{
const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
handWorld.copy(camera.position).add(dir.multiplyScalar(.45));
handWorld.add(new THREE.Vector3(.25,-.25,0).applyQuaternion(camera.quaternion));
}
}

function resetChain(){
for(let i=0;i<=SEGMENTS;i++){
const t=i/SEGMENTS;
points[i].lerpVectors(handWorld,ball.position,t);
oldPoints[i].copy(points[i]);
}
chainReady=true;
}

function simulateChain(dt){
if(!chainReady)resetChain();

// Ostatni punkt jest przyczepiony do bili.
points[SEGMENTS].copy(ball.position);

// Początek łańcucha jest przy prawej ręce.
points[0].copy(handWorld);

const gravity=new THREE.Vector3(0,-9.81,0);
const subDt=Math.min(dt,1/30);
for(let i=1;i<SEGMENTS;i++){
const p=points[i];
const old=oldPoints[i].clone();
const velocity=p.clone().sub(old).multiplyScalar(.985);
oldPoints[i].copy(p);
p.add(velocity);
p.addScaledVector(gravity,subDt*subDt);
}

// Kilka przebiegów ograniczających długość segmentów
const spacing=points[0].distanceTo(points[SEGMENTS])/SEGMENTS;
const restLength=Math.max(.055,spacing);
for(let pass=0;pass<5;pass++){
points[0].copy(handWorld);
points[SEGMENTS].copy(ball.position);
for(let i=0;i<SEGMENTS;i++){
const a=points[i],b=points[i+1];
const delta=b.clone().sub(a);
const len=delta.length();
if(len<.0001)continue;
const correction=delta.multiplyScalar((len-restLength)/len);
if(i!==0)a.addScaledVector(correction,.5);
if(i+1!==SEGMENTS)b.addScaledVector(correction,-.5);
}
}

// Narysuj ogniwa wzdłuż łańcucha
for(let i=0;i<SEGMENTS;i++){
const a=points[i],b=points[i+1];
const middle=a.clone().add(b).multiplyScalar(.5);
const direction=b.clone().sub(a);
links[i].position.copy(middle);
links[i].quaternion.setFromUnitVectors(DOWN,direction.normalize());
links[i].scale.set(1,Math.max(.25,a.distanceTo(b)/.095),1);
}
}

// Wrogowie z prostym ragdollem
const enemies=[];
const ragdolls=[];

function spawnEnemy(){
const angle=Math.random()*Math.PI*2;
const dist=7+Math.random()*6;
const group=new THREE.Group();
group.position.set(Math.cos(angle)*dist,0,Math.sin(angle)*dist);

const mat=new THREE.MeshStandardMaterial({color:0x1478ff});
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.75,4,8),mat);
torso.position.y=1;
torso.castShadow=true;
group.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.19,12,12),
new THREE.MeshStandardMaterial({color:0xffc59b})
);
head.position.y=1.63;
group.add(head);
scene.add(group);

enemies.push({group,hp:3,lastHit:0,alive:true});
}

function startWave(){
for(let i=0;i<Math.min(3+Math.floor(enemies.length*.1),12);i++)spawnEnemy();
}

function makeRagdoll(pos){
const group=new THREE.Group();
for(let i=0;i<5;i++){
const limb=new THREE.Mesh(
new THREE.BoxGeometry(i===0?.36:.14,i===0?.5:.42,.15),
new THREE.MeshStandardMaterial({color:0x343d4a})
);
limb.position.set((Math.random()-.5)*.4,.3+Math.random()*.9,(Math.random()-.5)*.3);
limb.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
group.add(limb);
}
group.position.copy(pos);
scene.add(group);
ragdolls.push({group,velocity:new THREE.Vector3((Math.random()-.5)*4,3,(Math.random()-.5)*4),time:performance.now()});
}

function hitEnemy(enemy,velocity){
const now=performance.now();
if(!enemy.alive||now-enemy.lastHit<450)return;
enemy.lastHit=now;
enemy.hp--;
if(velocity.length()>0.5){
enemy.group.position.addScaledVector(velocity,.025);
}
if(enemy.hp<=0){
enemy.alive=false;
const pos=enemy.group.position.clone();
scene.remove(enemy.group);
makeRagdoll(pos);
}
}

function movePlayer(dt){
if(renderer.xr.isPresenting){
const session=renderer.xr.getSession();
let input=null;
for(const source of session.inputSources){
if(source.handedness==='left'&&source.gamepad){input=source.gamepad;break;}
}
if(input){
const x=input.axes.length>=4?input.axes[2]:input.axes[0];
const z=input.axes.length>=4?input.axes[3]:input.axes[1];
const forward=new THREE.Vector3(0,0,-1);
renderer.xr.getCamera(camera).getWorldDirection(forward);
forward.y=0;
forward.normalize();
const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize().negate();
player.position.addScaledVector(forward,-z*dt*3);
player.position.addScaledVector(right,x*dt*3);
}
}else{
const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
const speed=dt*3.5;
if(keys.KeyW||keys.ArrowUp)player.position.addScaledVector(forward,speed);
if(keys.KeyS||keys.ArrowDown)player.position.addScaledVector(forward,-speed);
if(keys.KeyA||keys.ArrowLeft)player.position.addScaledVector(right,-speed);
if(keys.KeyD||keys.ArrowRight)player.position.addScaledVector(right,speed);
}
player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);
}

const clock=new THREE.Clock();
let waveTimer=0;

function animate(){
const dt=Math.min(clock.getDelta(),.033);
movePlayer(dt);
getHandPosition();

if(!chainReady)resetChain();
if(handVelocity.lengthSq()<100){
handVelocity.copy(handWorld).sub(prevHandWorld).divideScalar(Math.max(dt,.001));
}else handVelocity.set(0,0,0);

// Broń śledzi ruch dłoni. Siła pędu jest ograniczona.
const oldBall=ball.position.clone();
const handToBall=ball.position.clone().sub(handWorld);
const distance=handToBall.length();
if(distance>.65){
const dir=handToBall.normalize();
ball.position.addScaledVector(dir,-Math.min((distance-.65)*.12,.12));
}
ball.position.addScaledVector(handVelocity,dt*.10);
ball.position.y=Math.max(.18,ball.position.y-9.81*dt*dt*.15);
ball.position.lerp(handWorld.clone().add(new THREE.Vector3(0,-.25,-.3)),dt*.025);

simulateChain(dt);

const speed=ball.position.distanceTo(oldBall)/Math.max(dt,.001);
for(const enemy of enemies){
if(!enemy.alive)continue;
const ep=enemy.group.position;
const toward=new THREE.Vector3(player.position.x-ep.x,0,player.position.z-ep.z);
const dist=toward.length();
if(dist>1.1){
toward.normalize();
ep.addScaledVector(toward,dt*1.1);
enemy.group.lookAt(player.position.x,0,player.position.z);
}else if(performance.now()-lastDamage>900){
hp=Math.max(0,hp-2);
lastDamage=performance.now();
document.getElementById('hp').textContent=hp;
if(hp<=0)gameEnded=true;
}
if(ball.position.distanceTo(ep.clone().add(new THREE.Vector3(0,1,0)))<.7){
hitEnemy(enemy,handVelocity.clone().multiplyScalar(Math.min(speed,8)));
}
}

for(let i=enemies.length-1;i>=0;i--){
if(!enemies[i].alive)enemies.splice(i,1);
}
document.getElementById('enemies').textContent=enemies.length;

for(let i=ragdolls.length-1;i>=0;i--){
const r=ragdolls[i];
r.velocity.y-=9.81*dt;
r.group.position.addScaledVector(r.velocity,dt);
if(r.group.position.y<0){
r.group.position.y=0;
r.velocity.y=Math.abs(r.velocity.y)*.25;
r.velocity.x*=.8;
r.velocity.z*=.8;
}
r.group.rotation.x+=r.velocity.z*dt*.1;
r.group.rotation.z+=r.velocity.x*dt*.1;
if(performance.now()-r.time>5000){
scene.remove(r.group);
ragdolls.splice(i,1);
}
}

waveTimer+=dt;
if(enemies.length===0&&waveTimer>2&&!gameEnded){
waveTimer=0;
startWave();
}
document.getElementById('mode').textContent=renderer.xr.isPresenting?'Tryb: VR':'Tryb: ekran';
renderer.render(scene,camera);
}

renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
